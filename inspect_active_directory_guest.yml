---
- name: Inspect the dedicated AD guest without changing its state
  hosts: all
  gather_facts: false
  vars_files:
    - vars/active_directory_vault.yml
    - vars/active_directory_connection.yml
  vars:
    ansible_user: "{{ active_directory.domain_admin_username if ad_inspect_domain_auth | default(false) | bool else active_directory.bootstrap_username }}"
    ansible_password: "{{ active_directory.domain_admin_password if ad_inspect_domain_auth | default(false) | bool else active_directory.bootstrap_password }}"
  tasks:
    - name: Inspect available configuration collections in the execution environment
      ansible.builtin.command:
        argv: [ansible-galaxy, collection, list, --format=json]
      delegate_to: localhost
      vars:
        ansible_connection: local
      register: ad_execution_collections
      changed_when: false
      no_log: true

    - name: Inspect OS, networking, servicing, licensing and certificate metadata
      ansible.windows.win_powershell:
        depth: 5
        parameters:
          IdentityScript: "{{ lookup('ansible.builtin.file', 'assets/configure-active-directory-identities.ps1') }}"
        script: |
          param([string]$IdentityScript)
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseInput($IdentityScript,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw 'The directory identity script has a PowerShell parse error.' }
          $os = Get-CimInstance Win32_OperatingSystem
          $cs = Get-CimInstance Win32_ComputerSystem
          $version = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $licenses = @(Get-CimInstance SoftwareLicensingProduct -Filter "ApplicationID='55c92734-d682-4d71-983e-d6ec3f16059f' AND PartialProductKey IS NOT NULL" | Select-Object Name,LicenseStatus,GracePeriodRemaining)
          $events = @(Get-WinEvent -LogName 'Microsoft-Windows-WindowsUpdateClient/Operational' -MaxEvents 8 -ErrorAction SilentlyContinue | Select-Object TimeCreated,Id,Message)
          $systemUpdateEvents = @(Get-WinEvent -FilterHashtable @{LogName='System';ProviderName='Microsoft-Windows-WindowsUpdateClient'} -MaxEvents 12 -ErrorAction SilentlyContinue | Select-Object TimeCreated,Id,Message)
          $agentState = @{ Available=$false }
          try {
              $session = New-Object -ComObject Microsoft.Update.Session
              $installer = $session.CreateUpdateInstaller()
              $agentState = @{ Available=$true; InstallerBusy=$installer.IsBusy; RebootRequiredBeforeInstallation=$installer.RebootRequiredBeforeInstallation }
          } catch { $agentState = @{ Available=$false; ErrorCode=$_.Exception.HResult } }
          $updateTasks = @(Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object TaskName -Match '(?i)ansible' | ForEach-Object {
              try {
                  $info = $_ | Get-ScheduledTaskInfo -ErrorAction Stop
                  @{ Name=$_.TaskName; State=$_.State.ToString(); LastRunTime=$info.LastRunTime; LastTaskResult=$info.LastTaskResult }
              } catch {}
          })
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$($env:SystemDrive)'"
          $servicing = @(Get-Process -Name TiWorker,TrustedInstaller,MoUsoCoreWorker,wuauclt -ErrorAction SilentlyContinue | Select-Object Name,Id,CPU,WorkingSet64,StartTime)
          $delivery = @()
          if (Get-Command Get-DeliveryOptimizationStatus -ErrorAction SilentlyContinue) {
              try { $delivery = @(Get-DeliveryOptimizationStatus -ErrorAction Stop | Select-Object FileId,Status,FileSize,TotalBytesDownloaded,BytesFromHttp,BytesFromPeers) } catch {}
          }
          $bits = @()
          if (Get-Command Get-BitsTransfer -ErrorAction SilentlyContinue) {
              try { $bits = @(Get-BitsTransfer -AllUsers -ErrorAction Stop | Select-Object JobState,BytesTotal,BytesTransferred,CreationTime,ModificationTime) } catch {}
          }
          $cbsPath = "$env:SystemRoot\Logs\CBS\CBS.log"
          $healthRoot = "$env:SystemRoot\System32\SecurityHealth"
          $healthFiles = @()
          if (Test-Path $healthRoot) {
              $healthFiles = @(Get-ChildItem $healthRoot -Recurse -File -Filter '*.exe' -ErrorAction SilentlyContinue | ForEach-Object {
                  @{ Path=$_.FullName; FileVersion=$_.VersionInfo.FileVersion; ProductVersion=$_.VersionInfo.ProductVersion; Modified=$_.LastWriteTime }
              })
          }
          $healthService = @(Get-CimInstance Win32_Service -Filter "Name='SecurityHealthService'" -ErrorAction SilentlyContinue | Select-Object Name,State,StartMode,PathName)
          $healthServiceFile = Get-Item "$env:SystemRoot\System32\SecurityHealthService.exe" -ErrorAction SilentlyContinue
          $healthServiceVersion = if ($healthServiceFile) { $healthServiceFile.VersionInfo.FileVersion } else { $null }
          $healthApp = @()
          try { $healthApp = @(Get-AppxPackage -AllUsers -Name Microsoft.SecHealthUI -ErrorAction Stop | Select-Object Name,Version,PackageFullName,InstallLocation,Status,PackageUserInformation) } catch {}
          $healthRegistry = $null
          if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows Security Health\Platform') {
              $healthRegistry = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Security Health\Platform'
          }
          $cbs = $null
          if (Test-Path $cbsPath) {
              $cbs = @{ File=(Get-Item $cbsPath | Select-Object Length,LastWriteTime); Tail=@(Get-Content $cbsPath -Tail 16 -ErrorAction SilentlyContinue) }
          }
          $Ansible.Changed = $false
          $Ansible.Result = @{
              Build="$($version.CurrentBuildNumber).$($version.UBR)";
              DomainRole=$cs.DomainRole; Domain=$cs.Domain; Hostname=$cs.Name;
              Boot=$os.LastBootUpTime; Licenses=$licenses; UpdateEvents=$events;
              SystemUpdateEvents=$systemUpdateEvents;
              UpdateAgent=$agentState; AnsibleScheduledTasks=$updateTasks;
              FreeSystemBytes=$disk.FreeSpace; ServicingProcesses=$servicing;
              DeliveryOptimization=$delivery; BitsTransfers=$bits; ServicingLog=$cbs;
              SecurityHealth=@{ Files=$healthFiles; Service=$healthService; ServiceFileVersion=$healthServiceVersion; App=$healthApp; Registry=$healthRegistry };
              Network=@(Get-NetIPConfiguration | Select-Object InterfaceAlias,IPv4Address,IPv4DefaultGateway,DNSServer);
              PendingReboot=((Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending') -or (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired'));
              Certificates=@(Get-ChildItem Cert:\LocalMachine\My | Select-Object Subject,Thumbprint,NotAfter,HasPrivateKey);
              IdentityScriptParsed=$true
          }
      register: ad_read_only_inspection
      changed_when: false
      no_log: true

    - name: Optionally search Microsoft for remaining updates without installing them
      ansible.windows.win_updates:
        category_names: ['*']
        server_selection: windows_update
        skip_optional: false
        state: searched
      register: ad_read_only_update_scan
      when: ad_inspect_update_scan | default(false) | bool
      no_log: true

    - name: Save the optional read-only software update scan
      ansible.builtin.set_stats:
        data:
          active_directory_readonly_update_scan:
            remaining_count: "{{ ad_read_only_update_scan.found_update_count }}"
            reboot_required: "{{ ad_read_only_update_scan.reboot_required | default(false) }}"
            updates: "{{ ad_read_only_update_scan.updates | default({}) }}"
        aggregate: false
      when: ad_inspect_update_scan | default(false) | bool
      no_log: true

    - name: Preserve the protected inspection evidence
      ansible.builtin.set_stats:
        data:
          active_directory_guest_inspection: "{{ ad_read_only_inspection.result }}"
          active_directory_execution_collections: "{{ ad_execution_collections.stdout | from_json }}"
        aggregate: false
      no_log: true

    - name: Report the inspection outcome without environment identities
      ansible.builtin.debug:
        msg:
          build: "{{ ad_read_only_inspection.result.Build }}"
          pending_reboot: "{{ ad_read_only_inspection.result.PendingReboot }}"
          identity_script_parsed: "{{ ad_read_only_inspection.result.IdentityScriptParsed }}"
