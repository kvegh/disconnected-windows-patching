---
- name: Validate Windows demo inventory
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/wsus_environment_vault.yml
  tasks:
    - name: Require both WSUS servers and managed clients
      ansible.builtin.assert:
        that:
          - groups.get('wsus_external', []) | length == 1
          - groups.get('wsus_internal', []) | length == 1
          - groups.get('windows_managed', []) | length >= 1
          - groups['wsus_external'] | intersect(groups['wsus_internal']) | length == 0
          - (groups['wsus_external'] + groups['wsus_internal']) | intersect(groups['windows_managed']) | length == 0
          - wsus_internal_url | default('') is match('^http://[^/\s]+:8530/?$')
          - wsus_client_sources | default([]) | length > 0
        fail_msg: >-
          Supply disjoint wsus_external, wsus_internal and windows_managed groups,
          wsus_internal_url (HTTP port 8530), and wsus_client_sources (allowed client addresses/subnets).

- name: Configure permanent Windows networking and guest identity
  hosts: wsus_external:wsus_internal:windows_managed
  gather_facts: false
  vars_files:
    - vars/wsus_environment_vault.yml
  tasks:
    - name: Wait for WinRM
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Check Ansible Windows execution
      ansible.windows.win_ping:

    - name: Require permanent network settings
      ansible.builtin.assert:
        that:
          - windows_network_interfaces | default([]) | length > 0
          - windows_connection_address | default('') | length > 0
          - windows_connection_address in (windows_network_interfaces | map(attribute='ipv4_address') | list)
          - windows_network_interfaces | map(attribute='mac') | unique | length == windows_network_interfaces | length
          - windows_network_interfaces | map(attribute='name') | unique | length == windows_network_interfaces | length
        fail_msg: Supply per-host windows_network_interfaces and windows_connection_address through protected inventory variables.
      no_log: "{{ wsus_no_log | default(true) | bool }}"

    - name: Validate each desired interface
      ansible.builtin.assert:
        that:
          - item.mac is match('(?i)^([0-9a-f]{2}:){5}[0-9a-f]{2}$')
          - item.name | length > 0
          - item.ipv4_address | length > 0
          - item.prefix_length | int >= 1
          - item.prefix_length | int <= 32
          - item.gateway is defined
          - item.dns_servers is defined
          - item.dns_servers is sequence and item.dns_servers is not string
          - inventory_hostname in groups['wsus_external'] or not item.gateway
          - inventory_hostname in groups['wsus_external'] or item.dns_servers | length == 0
        fail_msg: Supply MAC, adapter name, IPv4 address/prefix, gateway (empty for none), and DNS list. Only external WSUS may have a gateway or DNS.
      loop: "{{ windows_network_interfaces }}"
      no_log: "{{ wsus_no_log | default(true) | bool }}"

    - name: Validate MAC matches and addresses before changing networking
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', 'assets/configure-static-network.ps1') }}"
        error_action: stop
        parameters:
          ConfigurationJson: "{{ windows_network_interfaces | to_json }}"
          ValidateOnly: true
      no_log: "{{ wsus_no_log | default(true) | bool }}"

    - name: Apply permanent network settings asynchronously
      become: true
      become_method: runas
      become_user: SYSTEM
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', 'assets/configure-static-network.ps1') }}"
        error_action: stop
        parameters:
          ConfigurationJson: "{{ windows_network_interfaces | to_json }}"
          DisableForwarding: "{{ inventory_hostname in groups['wsus_internal'] }}"
      async: 180
      poll: 0
      register: windows_network_job
      when: not ansible_check_mode
      no_log: "{{ wsus_no_log | default(true) | bool }}"

    - name: Use permanent address for the remainder of this job
      ansible.builtin.set_fact:
        ansible_host: "{{ windows_connection_address }}"
      when: not ansible_check_mode
      no_log: "{{ wsus_no_log | default(true) | bool }}"

    - name: Reset connection after network configuration starts
      ansible.builtin.meta: reset_connection
      when: not ansible_check_mode

    - name: Reconnect at the permanent address
      ansible.builtin.wait_for_connection:
        delay: 20
        timeout: 300
      when: not ansible_check_mode

    - name: Confirm background network configuration completed successfully
      become: true
      become_method: runas
      become_user: SYSTEM
      ansible.builtin.async_status:
        jid: "{{ windows_network_job.ansible_job_id }}"
      register: windows_network_result
      until: windows_network_result.finished | default(false) | bool or windows_network_result.failed | default(false) | bool
      retries: 30
      delay: 5
      when: not ansible_check_mode
      no_log: "{{ wsus_no_log | default(true) | bool }}"

    - name: Clean up completed asynchronous job status
      become: true
      become_method: runas
      become_user: SYSTEM
      ansible.builtin.async_status:
        jid: "{{ windows_network_job.ansible_job_id }}"
        mode: cleanup
      when: not ansible_check_mode
      no_log: "{{ wsus_no_log | default(true) | bool }}"

    - name: Configure DNS with the Windows DNS client module
      ansible.windows.win_dns_client:
        adapter_names:
          - "{{ item.name }}"
        dns_servers: "{{ item.dns_servers }}"
      loop: "{{ windows_network_interfaces }}"
      no_log: "{{ wsus_no_log | default(true) | bool }}"
      when: not ansible_check_mode

    - name: Disable IP routing on internal repository server
      ansible.windows.win_regedit:
        path: 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
        name: IPEnableRouter
        data: 0
        type: dword
      when: inventory_hostname in groups['wsus_internal']

    - name: Set unique Windows hostname when supplied
      ansible.windows.win_hostname:
        name: "{{ windows_hostname }}"
      register: hostname_result
      when: windows_hostname is defined

    - name: Reboot after hostname change
      ansible.windows.win_reboot:
        reboot_timeout: 900
      when: hostname_result.reboot_required | default(false)

- name: Install and initialize WSUS servers
  hosts: wsus_external:wsus_internal
  gather_facts: false
  vars_files:
    - vars/wsus_environment_vault.yml
  vars:
    wsus_content_path: 'C:\WSUS'
    wsus_content_path_pattern: '^[A-Za-z]:\\[^\r\n"]+$'
  tasks:
    - name: Validate content path
      ansible.builtin.assert:
        that:
          - wsus_content_path is match(wsus_content_path_pattern)

    - name: Install WSUS with Windows Internal Database
      ansible.windows.win_feature:
        name:
          - UpdateServices-Services
          - UpdateServices-WidDB
        include_management_tools: true
        state: present
      register: wsus_features

    - name: Reboot when WSUS installation requires it
      ansible.windows.win_reboot:
        reboot_timeout: 1200
      when: wsus_features.reboot_required

    - name: Create update content directory
      ansible.windows.win_file:
        path: "{{ wsus_content_path }}"
        state: directory

    - name: Inspect registered WSUS content location
      ansible.windows.win_reg_stat:
        path: 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup'
        name: ContentDir
      register: wsus_registered_content
      tags: wsus_diagnostics
      no_log: "{{ wsus_no_log | default(true) | bool }}"

    - name: Report registered WSUS content location
      ansible.builtin.debug:
        msg:
          configured_content: "{{ wsus_registered_content.value | default('Not configured') }}"
          requested_content: "{{ wsus_content_path }}"
      tags: wsus_diagnostics
      no_log: "{{ wsus_no_log | default(true) | bool }}"

    - name: Initialize WSUS database and content location
      ansible.windows.win_powershell:
        error_action: stop
        parameters:
          ContentPath: "{{ wsus_content_path }}"
        script: |
          param([string]$ContentPath)
          $Ansible.Changed = $false
          $setup = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup'
          $expected = [IO.Path]::Combine($ContentPath, 'WsusContent').TrimEnd('\')
          $differentLocation = $setup.ContentDir -and
              $setup.ContentDir.TrimEnd('\') -notin @($ContentPath.TrimEnd('\'), $expected)
          $initialLocation = Join-Path $env:ProgramFiles 'Update Services'
          $installerDefault = $setup.ContentDir -and
              $setup.ContentDir.TrimEnd('\') -eq $initialLocation.TrimEnd('\')
          if ($differentLocation -and -not $installerDefault) {
              throw 'Existing WSUS content location differs; move content explicitly before continuing.'
          }
          $ready = $false
          try {
              Import-Module UpdateServices
              $server = Get-WsusServer
              $null = $server.GetConfiguration()
              $ready = [bool]$setup.ContentDir
          } catch {
              $ready = $false
          }
          if ($differentLocation -and $ready) {
              throw 'Initialized WSUS content location differs; move content explicitly before continuing.'
          }
          if ($differentLocation -and $installerDefault) {
              $existingContent = Join-Path $initialLocation 'WsusContent'
              if (Test-Path -LiteralPath $existingContent) {
                  $files = Get-ChildItem -LiteralPath $existingContent -File -Recurse |
                      Select-Object -First 1
                  if ($files) { throw 'Installer default contains update files; inspect before reinitializing.' }
              }
          }
          if (-not $ready) {
              $utility = Join-Path $env:ProgramFiles 'Update Services\Tools\WsusUtil.exe'
              & $utility postinstall "CONTENT_DIR=$ContentPath"
              if ($LASTEXITCODE -ne 0) { throw "WSUS postinstall failed: $LASTEXITCODE" }
              $Ansible.Changed = $true
          }

    - name: Configure manual synchronization and local update storage
      ansible.windows.win_powershell:
        error_action: stop
        script: |
          $Ansible.Changed = $false
          Import-Module UpdateServices
          $server = Get-WsusServer
          $config = $server.GetConfiguration()
          # Both servers are standalone. Internal WSUS is populated by offline import,
          # never by starting a synchronization to Microsoft or external WSUS.
          if (-not $config.SyncFromMicrosoftUpdate -or $config.IsReplicaServer -or
              $config.HostBinariesOnMicrosoftUpdate) {
              $config.SyncFromMicrosoftUpdate = $true
              $config.IsReplicaServer = $false
              $config.HostBinariesOnMicrosoftUpdate = $false
              $config.Save()
              $Ansible.Changed = $true
          }
          $subscription = $server.GetSubscription()
          if ($subscription.SynchronizeAutomatically) {
              $subscription.SynchronizeAutomatically = $false
              $subscription.Save()
              $Ansible.Changed = $true
          }
          $Ansible.Result = @{ Synchronization = 'Manual'; Content = 'Local' }

    - name: Allow clients to reach internal WSUS
      community.windows.win_firewall_rule:
        name: Demo WSUS client access
        direction: in
        action: allow
        protocol: tcp
        localport: '8530,8531'
        remoteip: "{{ wsus_client_sources | join(',') }}"
        profiles: domain,private,public
        enabled: true
        state: present
      when: inventory_hostname in groups['wsus_internal']

- name: Configure managed servers to use internal WSUS
  hosts: windows_managed
  gather_facts: false
  vars_files:
    - vars/wsus_environment_vault.yml
  tasks:
    - name: Set local Windows Update policies
      ansible.windows.win_regedit:
        path: "{{ item.path }}"
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: "{{ item.type }}"
      loop:
        - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          name: WUServer
          data: "{{ wsus_internal_url | regex_replace('/$', '') }}"
          type: string
        - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          name: WUStatusServer
          data: "{{ wsus_internal_url | regex_replace('/$', '') }}"
          type: string
        - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          name: DoNotConnectToWindowsUpdateInternetLocations
          data: 1
          type: dword
        - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
          name: UseWUServer
          data: 1
          type: dword
        - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
          name: NoAutoUpdate
          data: 1
          type: dword
      register: update_policy

    - name: Restart Windows Update after policy changes
      ansible.windows.win_service:
        name: wuauserv
        state: restarted
      when: update_policy.changed

    - name: Ensure Windows Update service is available for Ansible patch jobs
      ansible.windows.win_service:
        name: wuauserv
        start_mode: manual
        state: started

    - name: Verify internal WSUS client web service is reachable
      ansible.windows.win_uri:
        url: "{{ wsus_internal_url | regex_replace('/$', '') }}/ClientWebService/client.asmx"
        status_code: 200
      changed_when: false
