---
- name: Configure the managed Windows patch installation Job Template
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    windows_patching_template_name: Disconnected Windows Patching - Update Managed Windows
  tasks:
    - name: Require protected controller references
      ansible.builtin.assert:
        that:
          - wsus_controller_inventory | default('') | string | length > 0
          - wsus_controller_project | default('') | string | length > 0
          - wsus_controller_execution_environment | default('') | string | length > 0
          - wsus_controller_credentials | default([]) | length > 0
        fail_msg: Supply inventory, project, execution environment and Machine plus Vault credentials through protected configuration.

    - name: Refresh the project so its selected playbook is available
      ansible.controller.project_update:
        controller_host: "{{ wsus_controller_host | default(omit) }}"
        controller_oauthtoken: "{{ wsus_controller_token | default(omit) }}"
        validate_certs: true
        project: "{{ wsus_controller_project | string }}"
        wait: true
        timeout: 600
      when: wsus_controller_refresh_project | default(true) | bool
      no_log: true

    - name: Configure the current-ceiling patch template
      ansible.controller.job_template:
        controller_host: "{{ wsus_controller_host | default(omit) }}"
        controller_oauthtoken: "{{ wsus_controller_token | default(omit) }}"
        validate_certs: true
        name: "{{ windows_patching_template_name }}"
        description: >-
          Validate the current internal WSUS monthly ceiling, then install its
          applicable approved updates on the selected managed Windows endnodes,
          following required reboot and rescan cycles. Disjoint host limits allow
          simultaneous per-server jobs. Check mode searches only.
        inventory: "{{ wsus_controller_inventory | string }}"
        project: "{{ wsus_controller_project | string }}"
        execution_environment: "{{ wsus_controller_execution_environment | string }}"
        credentials: "{{ wsus_controller_credentials | map('string') | list }}"
        playbook: update_managed_windows.yml
        job_type: run
        survey_enabled: false
        ask_variables_on_launch: false
        ask_job_type_on_launch: true
        ask_limit_on_launch: true
        allow_simultaneous: true
        timeout: 43200
        verbosity: 0
        state: present
      register: windows_patching_template_configuration
      no_log: true

    - name: Report configured template
      ansible.builtin.debug:
        msg:
          name: "{{ windows_patching_template_name }}"
          id: "{{ windows_patching_template_configuration.id }}"
          changed: "{{ windows_patching_template_configuration.changed }}"
