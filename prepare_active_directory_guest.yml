---
- name: Prepare and fully update the dedicated Active Directory guest
  hosts: all
  gather_facts: false
  serial: 1
  vars_files:
    - vars/active_directory_vault.yml
    - vars/active_directory_connection.yml
  vars:
    ansible_user: "{{ active_directory.bootstrap_username }}"
    ansible_password: "{{ active_directory.bootstrap_password }}"
    ad_windows_hostname: "{{ active_directory.hostname }}"
  pre_tasks:
    - name: Load the explicitly selected private Windows runtime profile
      ansible.builtin.include_tasks: tasks/windows_runtime_settings.yml
      when: windows_runtime_settings_vault is defined
      tags: always

  tasks:
    - name: Require one explicitly selected Windows guest
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - ad_windows_hostname | default('') is match('^[A-Za-z][A-Za-z0-9-]{0,14}$')
          - ad_direct_microsoft_updates_approved | default(false) | bool
        fail_msg: Select only the dedicated AD guest and approve its direct Microsoft updates.
      no_log: true

    - name: Connect using the valid protected identity before or after promotion
      ansible.builtin.include_tasks: tasks/connect_active_directory_guest.yml

    - name: Use UTC to match the selected AD guest's virtual hardware clock
      ansible.windows.win_timezone:
        timezone: UTC
      when: windows_runtime_settings_vault is defined

    - name: Verify Windows Server 2025, disk space and installed license state
      # Platform/API reason: [rationale](docs/supporting-code.md#windows-inspection-and-evidence).
      ansible.windows.win_powershell:
        parameters:
          ReferenceUtc: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') if windows_runtime_settings_vault is defined else '' }}"
        script: |
          # Language choice: [rationale](docs/supporting-code.md#windows-inspection-and-evidence).
          # win_timezone does not repair UTC drift; [clock handling](docs/supporting-code.md#windows-networking-and-activation).
          param([string]$ReferenceUtc)
          $clockChanged = $false
          $offset = $null
          if ($ReferenceUtc) {
              $reference = [DateTime]::Parse($ReferenceUtc).ToUniversalTime()
              $offset = [Math]::Abs(([DateTime]::UtcNow - $reference).TotalSeconds)
              $clockChanged = $offset -gt 120
              if ($clockChanged) { Set-Date -Date $reference -ErrorAction Stop | Out-Null }
              $offset = [Math]::Abs(([DateTime]::UtcNow - $reference).TotalSeconds)
              if ($offset -gt 120) {
                  throw 'The AD guest clock still differs from automation UTC by more than two minutes.'
              }
          }
          $os = Get-CimInstance Win32_OperatingSystem
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$($env:SystemDrive)'"
          if ($os.BuildNumber -ne '26100' -or $os.ProductType -eq 1) {
              throw 'The selected guest must be Windows Server 2025.'
          }
          if ($disk.FreeSpace -lt 12GB) { throw 'At least 12 GiB free system disk space is required.' }
          $licenseFilter = "ApplicationID='55c92734-d682-4d71-983e-d6ec3f16059f' AND PartialProductKey IS NOT NULL"
          $licenses = @(Get-CimInstance SoftwareLicensingProduct -Filter $licenseFilter |
              Where-Object { -not $_.LicenseIsAddon })
          if ($licenses.Count -ne 1) { throw 'Expected exactly one installed Windows operating system license.' }
          $license = $licenses[0]
          $evaluation = $license.Description -match 'TIMEBASED_EVAL' -or $license.Name -match 'Eval'
          $Ansible.Changed = $clockChanged
          $Ansible.Result = @{
              Build = $os.BuildNumber; FreeBytes = $disk.FreeSpace;
              LicenseStatus = [int]$license.LicenseStatus;
              Evaluation = [bool]$evaluation; GraceMinutes = [int]$license.GracePeriodRemaining;
              ClockUtc = [DateTime]::UtcNow.ToString('o'); TimeZone = (Get-TimeZone).Id;
              ClockOffsetSeconds = $offset
          }
      register: ad_windows_prerequisites
      no_log: true

    - name: Retain the actual prerequisite result before its licensing gate
      ansible.builtin.set_stats:
        data:
          active_directory_prerequisites: "{{ ad_windows_prerequisites.result }}"
        aggregate: false
      no_log: true

    - name: Retain the current license evidence without changing initial prerequisites
      ansible.builtin.set_fact:
        ad_windows_license: "{{ ad_windows_prerequisites.result }}"
      no_log: true

    - name: Activate an invalid selected AD evaluation before its existing license gate
      when:
        - windows_runtime_settings_vault is defined
        - not ansible_check_mode
        - >-
          ad_windows_prerequisites.result.LicenseStatus != 1 or
          (ad_windows_prerequisites.result.Evaluation and ad_windows_prerequisites.result.GraceMinutes <= 0)
      no_log: true
      block:
        - name: Require the exact selected AD role and permanent interface mapping
          ansible.builtin.assert:
            that:
              - ad_windows_prerequisites.result.Evaluation is sameas true
              - inventory_hostname == active_directory.hostname
              - windows_runtime_guests[inventory_hostname].role == 'ad'
              - windows_runtime_guests[inventory_hostname].version | string == '2025'
              - windows_runtime_guests[inventory_hostname].interfaces | length == 1
              - windows_runtime_guests[inventory_hostname].interfaces[0].mac == active_directory.mac
              - windows_runtime_guests[inventory_hostname].interfaces[0].address == active_directory.ipv4
              - windows_runtime_guests[inventory_hostname].interfaces[0].network == active_directory.libvirt_network
            quiet: true

        - name: Bind only this AD guest's verified pre-promotion activation topology
          # DHCP supplies gateway DNS before promotion; later AD promotion selects
          # its own address. Inspect must reject a different topology before NAT.
          ansible.builtin.set_fact:
            windows_activation_connected_network: "{{ windows_activation_network }}"
            windows_activation_settings:
              inventory_host: "{{ inventory_hostname }}"
              vm_name: "{{ active_directory.hostname }}"
              windows_version: '2025'
              interfaces:
                - mac: "{{ active_directory.mac }}"
                  ipv4_address: "{{ active_directory.ipv4 }}"
                  prefix_length: "{{ active_directory.prefix_length }}"
                  dns_servers: ["{{ active_directory.gateway }}"]
                  gateway: "{{ active_directory.gateway }}"
              libvirt_interfaces:
                - mac: "{{ active_directory.mac }}"
                  network: "{{ active_directory.libvirt_network }}"

        - name: Reuse the complete guarded activation and original-topology verification
          ansible.builtin.include_tasks: tasks/activate_windows_guest.yml

        - name: Retain fresh final licensing evidence only after successful activation cleanup
          ansible.builtin.set_fact:
            ad_windows_license: >-
              {{ {'LicenseStatus': windows_activation_final.result.license_status,
                  'Evaluation': windows_activation_final.result.evaluation,
                  'GraceMinutes': windows_activation_final.result.grace_minutes} }}

    - name: Require a valid installed Windows license before the update run
      ansible.builtin.assert:
        that:
          - ad_windows_license.LicenseStatus == 1
          - not ad_windows_license.Evaluation or ad_windows_license.GraceMinutes > 0
        quiet: true
        fail_msg: Windows licensing is not valid for updates; inspect the protected prerequisite and activation results.

    - name: Set the dedicated guest hostname
      ansible.windows.win_hostname:
        name: "{{ ad_windows_hostname }}"
      register: ad_hostname_result
      no_log: true

    - name: Finish the hostname change
      ansible.windows.win_reboot:
        reboot_timeout: 1200
      when: ad_hostname_result.reboot_required

    - name: Select public Microsoft update sources only on the dedicated guest
      ansible.windows.win_regedit:
        path: "{{ item.path }}"
        name: "{{ item.name }}"
        data: 0
        type: dword
      loop:
        - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
          name: UseWUServer
        - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          name: DoNotConnectToWindowsUpdateInternetLocations
        - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          name: DisableWindowsUpdateAccess
        - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          name: SetPolicyDrivenUpdateSourceForQualityUpdates
        - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          name: SetPolicyDrivenUpdateSourceForFeatureUpdates
        - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          name: SetPolicyDrivenUpdateSourceForOtherUpdates
        - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          name: SetPolicyDrivenUpdateSourceForDriverUpdates

    - name: Read inherited WSUS endpoint presence without exposing its values
      ansible.windows.win_reg_stat:
        path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
        name: "{{ item }}"
      loop: [WUServer, WUStatusServer]
      register: ad_wsus_endpoints_before
      when: windows_runtime_settings_vault is defined
      no_log: true

    - name: Remove inherited WSUS URLs from the selected public-update AD guest
      ansible.windows.win_regedit:
        path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
        name: "{{ item }}"
        state: absent
      loop: [WUServer, WUStatusServer]
      when: windows_runtime_settings_vault is defined
      no_log: true

    - name: Read back the selected AD guest's public update-source baseline
      ansible.windows.win_reg_stat:
        path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
        name: "{{ item }}"
      loop: [WUServer, WUStatusServer]
      register: ad_wsus_endpoints_after
      when: windows_runtime_settings_vault is defined
      no_log: true

    - name: Require inherited WSUS endpoint values absent on the selected AD guest
      ansible.builtin.assert:
        that: ad_wsus_endpoints_after.results | selectattr('exists', 'equalto', true) | list | length == 0
        quiet: true
        fail_msg: The selected public-update AD guest still has inherited WSUS endpoint values.
      when: windows_runtime_settings_vault is defined

    - name: Record only numeric AD update-source cleanup evidence
      ansible.builtin.set_stats:
        data:
          windows_ad_public_source_cleanup:
            before_count: "{{ ad_wsus_endpoints_before.results | selectattr('exists', 'equalto', true) | list | length }}"
            after_count: "{{ ad_wsus_endpoints_after.results | selectattr('exists', 'equalto', true) | list | length }}"
        per_host: false
      when: windows_runtime_settings_vault is defined

    - name: Complete an explicitly requested reboot for update-agent recovery
      ansible.windows.win_reboot:
        reboot_timeout: 1800
        post_reboot_delay: 30
      when: ad_reboot_update_recovery | default(false) | bool

    - name: Release the completed selected AD baseline before public update downloads
      ansible.builtin.include_tasks: tasks/windows_verified_guest_release.yml
      when: windows_runtime_settings_vault is defined and not ansible_check_mode

    - name: Make Windows Update available for the explicit update run
      ansible.windows.win_service:
        name: wuauserv
        start_mode: manual
        state: started

    - name: Install every applicable Server software update category and complete required reboots
      ansible.windows.win_updates:
        category_names: ['*']
        server_selection: windows_update
        skip_optional: false
        # Microsoft limits this UI package to Windows 11; the Server guard above
        # prevents applying this exception to a client OS. Defender updates remain included.
        reject_list: ['^Update for Windows Security platform - KB5007651\b']
        state: installed
        reboot: true
        reboot_timeout: 1800
      register: ad_windows_updates
      no_log: "{{ not (ad_update_diagnostics | default(false) | bool) }}"

    - name: Rescan the public update source after installation
      ansible.windows.win_updates:
        category_names: ['*']
        server_selection: windows_update
        skip_optional: false
        reject_list: ['^Update for Windows Security platform - KB5007651\b']
        state: searched
      register: ad_windows_update_scan
      no_log: true

    - name: Record the unsupported Windows 11 offer separately from Server updates
      ansible.builtin.set_fact:
        ad_windows11_update_offers: >-
          {{ ad_windows_update_scan.filtered_updates | default({}) | dict2items
             | selectattr('value.title', 'match', '^Update for Windows Security platform - KB5007651(?:[ (]|$)')
             | map(attribute='value') | list }}
      no_log: true

    - name: Require successful installation and no remaining applicable Server updates
      ansible.builtin.assert:
        that:
          - ad_windows_updates.failed_update_count | default(0) | int == 0
          - ad_windows_update_scan.found_update_count | int == 0
        fail_msg: Applicable Server updates remain or an update failed; inspect the protected result before promotion.
      no_log: true

    - name: Save update evidence in authenticated job artifacts
      ansible.builtin.set_stats:
        data:
          active_directory_update_result:
            installed_count: "{{ ad_windows_updates.installed_update_count | default(0) }}"
            remaining_count: "{{ ad_windows_update_scan.found_update_count }}"
            updates: "{{ ad_windows_updates.updates | default({}) }}"
            reboot_required: "{{ ad_windows_update_scan.reboot_required | default(false) }}"
            nonapplicable_windows11_offers: "{{ ad_windows11_update_offers }}"
        aggregate: false
      no_log: true

    - name: Report completion without guest identities or credentials
      ansible.builtin.debug:
        msg:
          applicable_server_updates_remaining: "{{ ad_windows_update_scan.found_update_count }}"
          nonapplicable_windows11_offers: "{{ ad_windows11_update_offers | length }}"
          result: All applicable Microsoft Server software updates were installed; Windows 11-only offers are reported separately.
