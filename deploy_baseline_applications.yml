---
- name: Deploy baseline offline applications to Windows endnodes
  hosts: windows_managed
  gather_facts: false
  vars_files:
    - vars/chocolatey_packages.yml
    - vars/wsus_environment_vault.yml
  pre_tasks:
    - name: Load the explicitly selected private Windows runtime profile
      ansible.builtin.include_tasks: tasks/windows_runtime_settings.yml
      when: windows_runtime_settings_vault is defined
      tags: always

  tasks:
    - name: Select baseline packages
      ansible.builtin.include_tasks: tasks/deploy_chocolatey_release.yml
      vars:
        application_release_track: baseline
        application_source_url: "{{ chocolatey_baseline_source_url }}"
