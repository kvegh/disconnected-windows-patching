---
- name: Prepare the verified SSH connection to the selected test platform
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/active_directory_vault.yml
    - vars/active_directory_target.yml
  tasks:
    - name: Check the selected target credential before using platform trust
      ansible.builtin.include_tasks: tasks/require_active_directory_target.yml

    - name: Create an owner-only temporary SSH trust directory
      ansible.builtin.tempfile:
        state: directory
        prefix: ad-platform-trust-
      register: ad_trust_workspace
      no_log: true

    - name: Use the previously verified SSH host key
      ansible.builtin.copy:
        dest: "{{ ad_trust_workspace.path }}/known_hosts"
        content: "{{ ad_target_ssh_known_hosts }}"
        mode: '0600'
      no_log: true

    - name: Add only the selected platform's protected connection
      ansible.builtin.add_host:
        name: ad_trust_target
        groups: ad_trust_targets
        ansible_host: "{{ (ad_target_api_url) | ansible.builtin.urlsplit('hostname') }}"
        ansible_connection: ssh
        ansible_user: "{{ ad_target_ssh_username }}"
        ansible_password: "{{ ad_target_ssh_password }}"
        ansible_become_password: "{{ ad_target_ssh_password }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ ad_trust_workspace.path }}/known_hosts"
      no_log: true

- name: Configure CA trust on the selected platform and its gateway runtime
  hosts: ad_trust_targets
  gather_facts: false
  become: true
  vars_files:
    - vars/active_directory_vault.yml
    - vars/active_directory_target.yml
  tasks:
    - name: Resolve the existing AAP service account
      ansible.builtin.getent:
        database: passwd
        key: "{{ ad_target_install_username }}"
      no_log: true

    - name: List existing service-account containers before selecting the gateway
      # Platform/API reason: [rationale](docs/supporting-code.md#active-directory-and-aap-verification).
      ansible.builtin.command:
        argv: [runuser, -u, "{{ ad_target_install_username }}", --, podman, ps, --format=json]
        chdir: /
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[ad_target_install_username][1] }}"
      register: ad_gateway_containers
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require a successful rootless container inspection
      ansible.builtin.assert:
        that: ad_gateway_containers.rc == 0
        fail_msg: "Rootless container inspection failed: {{ ad_gateway_containers.stderr }}"

    - name: Select the existing non-proxy gateway container
      ansible.builtin.set_fact:
        ad_gateway_candidates: >-
          {{ (ad_gateway_containers.stdout | from_json) | selectattr('Names', 'search', 'gateway') | rejectattr('Names', 'search', 'proxy') |
          list }}
      no_log: true

    - name: Require exactly one existing gateway runtime
      ansible.builtin.assert:
        that: ad_gateway_candidates | length == 1
        fail_msg: The selected service account does not own exactly one gateway container.

    - name: Record the existing gateway runtime name
      ansible.builtin.set_fact:
        ad_gateway_container_name: "{{ ad_gateway_candidates[0].Names[0] }}"
      no_log: true

    - name: Inspect the existing gateway container mounts
      # Platform/API reason: [rationale](docs/supporting-code.md#active-directory-and-aap-verification).
      ansible.builtin.command:
        argv: [runuser, -u, "{{ ad_target_install_username }}", --, podman, inspect, "{{ ad_gateway_container_name }}"]
        chdir: /
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[ad_target_install_username][1] }}"
      register: ad_gateway_container
      changed_when: false
      no_log: true

    - name: Locate the existing read-only CA trust mount
      ansible.builtin.set_fact:
        ad_gateway_ca_mounts: >-
          {{ (ad_gateway_container.stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/etc/pki/ca-trust/extracted') |
          list }}
      no_log: true

    - name: Require the expected bind-mounted certificate trust layout
      ansible.builtin.assert:
        that:
          - ad_gateway_ca_mounts | length == 1
          - ad_gateway_ca_mounts[0].Type == 'bind'
          - ad_gateway_ca_mounts[0].Source.startswith('/home/')
        fail_msg: Inspect the target's gateway trust layout before changing an unexpected mount.
      no_log: true

    - name: Add the dedicated public CA to the host's trust anchors
      ansible.builtin.copy:
        dest: "/etc/pki/ca-trust/source/anchors/{{ active_directory.prefix }}-ad-demo.crt"
        content: "{{ active_directory.ca_certificate }}"
        owner: root
        group: root
        mode: '0644'
      notify: Refresh the Active Directory host trust
      no_log: true

    - name: Apply notified trust changes before gateway verification
      ansible.builtin.meta: flush_handlers

    - name: Preserve existing gateway trust and add the dedicated public CA
      ansible.builtin.blockinfile:
        path: "{{ ad_gateway_ca_mounts[0].Source }}/pem/tls-ca-bundle.pem"
        marker: "# {mark} ANSIBLE MANAGED {{ active_directory.prefix }} AD DEMO CA"
        block: "{{ active_directory.ca_certificate | trim }}"
        create: false
        unsafe_writes: false
      no_log: true

    - name: Verify the CA is readable inside the actual gateway container
      # Platform/API reason: [rationale](docs/supporting-code.md#active-directory-and-aap-verification).
      ansible.builtin.command:
        chdir: /
        argv:
          - runuser
          - -u
          - "{{ ad_target_install_username }}"
          - --
          - podman
          - exec
          - "{{ ad_gateway_container_name }}"
          - python3
          - -c
          - |
            # Language choice: [rationale](docs/supporting-code.md#active-directory-and-aap-verification).
            import ssl,sys
            context=ssl.create_default_context()
            wanted=sys.argv[1]
            if not any(wanted in str(cert.get('subject',())) for cert in context.get_ca_certs()):
                raise RuntimeError('The gateway runtime does not trust the intended AD CA.')
            print('Gateway CA trust verified')
          - "{{ active_directory.prefix }} Demo CA"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[ad_target_install_username][1] }}"
      changed_when: false
      no_log: true

    - name: Verify named LDAPS with the gateway's normal certificate validation
      # Platform/API reason: [rationale](docs/supporting-code.md#active-directory-and-aap-verification).
      ansible.builtin.command:
        chdir: /
        argv:
          - runuser
          - -u
          - "{{ ad_target_install_username }}"
          - --
          - podman
          - exec
          - "{{ ad_gateway_container_name }}"
          - python3
          - -c
          - |
            # Language choice: [rationale](docs/supporting-code.md#active-directory-and-aap-verification).
            import socket,ssl,sys
            name=sys.argv[1]
            with socket.create_connection((name,636),timeout=15) as tcp:
                with ssl.create_default_context().wrap_socket(tcp,server_hostname=name) as tls:
                    print('Gateway LDAPS chain and hostname verification passed')
          - "{{ active_directory.fqdn }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[ad_target_install_username][1] }}"
      changed_when: false
      when: ad_trust_verify_ldaps | default(false) | bool
      no_log: true

    - name: Report verified gateway CA trust
      ansible.builtin.debug:
        msg: Gateway trust was verified inside the existing container with certificate validation enabled.

    - name: Publish readiness only after gateway LDAPS verification
      ansible.builtin.set_stats:
        data:
          ad_gateway_trust_ready: true
        aggregate: false
      when: ad_trust_verify_ldaps | default(false) | bool

  handlers:
    - name: Refresh the Active Directory host trust
      # Platform/API reason: [rationale](docs/supporting-code.md#active-directory-and-aap-verification).
      ansible.builtin.command:
        argv: [update-ca-trust, extract]
      changed_when: true

- name: Remove the temporary SSH trust files
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove the protected temporary connection workspace
      ansible.builtin.file:
        path: "{{ ad_trust_workspace.path }}"
        state: absent
      when: ad_trust_workspace is defined
      no_log: true
