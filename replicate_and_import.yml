---
- name: Download the external export directly to internal WSUS and import metadata
  hosts: wsus_internal
  gather_facts: false
  vars_files:
    - vars/wsus_pipeline.yml
    - vars/wsus_patch_month.yml
    - vars/wsus_environment_vault.yml
  tasks:
    - name: Validate autonomous import inventory and protected transfer URL
      ansible.builtin.assert:
        that:
          - groups.get('wsus_external', []) | length == 1
          - groups.get('wsus_internal', []) | length == 1
          - groups['wsus_external'] | intersect(groups['wsus_internal']) | length == 0
          - wsus_transfer_base_url | default('') is match('^http://[^/\s]+:' ~ (wsus_transfer_port | string) ~ '/?$')
      no_log: "{{ wsus_no_log | bool }}"

    - name: Read the published snapshot reference over authenticated WinRM
      ansible.builtin.slurp:
        src: "{{ wsus_export_root }}\\current.json"
      delegate_to: "{{ groups['wsus_external'][0] }}"
      register: wsus_current_reference
      no_log: "{{ wsus_no_log | bool }}"

    - name: Select the immutable snapshot
      ansible.builtin.set_fact:
        wsus_snapshot_reference: "{{ wsus_current_reference.content | b64decode | from_json }}"
      no_log: "{{ wsus_no_log | bool }}"

    - name: Validate the snapshot identifier
      ansible.builtin.assert:
        that:
          - wsus_snapshot_reference.schemaVersion == 1
          - wsus_snapshot_reference.snapshot is match('^snapshot-[0-9]{8}T[0-9]{6}-[a-f0-9]{32}$')
      no_log: "{{ wsus_no_log | bool }}"

    - name: Obtain a trusted manifest checksum over authenticated WinRM
      ansible.windows.win_stat:
        path: "{{ wsus_export_root }}\\{{ wsus_snapshot_reference.snapshot }}\\manifest.json"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: "{{ groups['wsus_external'][0] }}"
      register: wsus_manifest_anchor
      no_log: "{{ wsus_no_log | bool }}"

    - name: Require the published immutable manifest
      ansible.builtin.assert:
        that: wsus_manifest_anchor.stat.exists

    - name: Create internal snapshot staging directory
      ansible.windows.win_file:
        path: "{{ wsus_import_root }}\\{{ wsus_snapshot_reference.snapshot }}"
        state: directory
      no_log: "{{ wsus_no_log | bool }}"

    - name: Download the manifest directly from external to internal WSUS
      ansible.windows.win_get_url:
        url: "{{ wsus_transfer_base_url | regex_replace('/$', '') }}/{{ wsus_snapshot_reference.snapshot }}/manifest.json"
        dest: "{{ wsus_import_root }}\\{{ wsus_snapshot_reference.snapshot }}\\manifest.json"
        checksum: "{{ wsus_manifest_anchor.stat.checksum }}"
        checksum_algorithm: sha256
        force: false
        use_proxy: false
        follow_redirects: none
        url_timeout: "{{ wsus_transfer_timeout | int }}"
      no_log: "{{ wsus_no_log | bool }}"

    - name: Read the verified manifest
      ansible.builtin.slurp:
        src: "{{ wsus_import_root }}\\{{ wsus_snapshot_reference.snapshot }}\\manifest.json"
      register: wsus_downloaded_manifest
      no_log: "{{ wsus_no_log | bool }}"

    - name: Decode the verified manifest
      ansible.builtin.set_fact:
        wsus_manifest: "{{ wsus_downloaded_manifest.content | b64decode | from_json }}"
      no_log: "{{ wsus_no_log | bool }}"

    - name: Require the manifest to describe the selected snapshot
      ansible.builtin.assert:
        that: wsus_manifest.snapshot == wsus_snapshot_reference.snapshot
      no_log: "{{ wsus_no_log | bool }}"

    - name: Validate manifest, matching settings and disk budget before transfer
      # Platform/API reason: [rationale](docs/supporting-code.md#wsus-server-operations).
      ansible.windows.win_powershell:
        error_action: stop
        depth: 5
        path: assets/prepare-wsus-import.ps1
        parameters:
          ManifestPath: "{{ wsus_import_root }}\\{{ wsus_snapshot_reference.snapshot }}\\manifest.json"
          ReserveGB: "{{ wsus_download_reserve_gb | int }}"
      register: wsus_import_preparation
      no_log: "{{ wsus_no_log | bool }}"

    - name: Create content subdirectories using native Ansible
      ansible.windows.win_file:
        path: "{{ wsus_import_preparation.result.ContentPath }}\\{{ item | replace('/', wsus_path_separator) }}"
        state: directory
      loop: "{{ wsus_import_preparation.result.Directories }}"
      no_log: "{{ wsus_no_log | bool }}"

    - name: Download and verify update files directly into internal WSUS content
      ansible.windows.win_get_url:
        url: "{{ wsus_transfer_base_url | regex_replace('/$', '') }}/content/{{ item.relativePath }}"
        dest: "{{ wsus_import_preparation.result.ContentPath }}\\{{ item.relativePath | replace('/', wsus_path_separator) }}"
        checksum: "{{ item.sha256 }}"
        checksum_algorithm: sha256
        force: false
        use_proxy: false
        follow_redirects: none
        url_timeout: "{{ wsus_transfer_timeout | int }}"
      # Preparation already verified existing matching files. Only missing or
      # mismatched files need the downloader's checksum verification.
      loop: "{{ wsus_import_preparation.result.FilesToDownload }}"
      loop_control:
        label: "{{ item.relativePath }}"
      no_log: "{{ wsus_no_log | bool }}"

    - name: Download and verify the complete metadata export
      ansible.windows.win_get_url:
        url: "{{ wsus_transfer_base_url | regex_replace('/$', '') }}/{{ wsus_manifest.metadata.path }}"
        dest: "{{ wsus_import_root }}\\{{ wsus_snapshot_reference.snapshot }}\\metadata.xml.gz"
        checksum: "{{ wsus_manifest.metadata.sha256 }}"
        checksum_algorithm: sha256
        force: false
        use_proxy: false
        follow_redirects: none
        url_timeout: "{{ wsus_transfer_timeout | int }}"
      no_log: "{{ wsus_no_log | bool }}"

    - name: Import WSUS metadata after the verified transfer
      # Platform/API reason: [rationale](docs/supporting-code.md#wsus-server-operations).
      ansible.windows.win_powershell:
        error_action: stop
        path: assets/import-wsus-metadata.ps1
        parameters:
          SnapshotPath: "{{ wsus_import_root }}\\{{ wsus_snapshot_reference.snapshot }}"
          ContentPath: "{{ wsus_import_preparation.result.ContentPath }}"
      become: true
      become_method: ansible.builtin.runas
      become_user: SYSTEM
      async: "{{ wsus_transfer_timeout | int }}"
      poll: 0
      register: wsus_operation
      no_log: "{{ wsus_no_log | bool }}"

    - name: Wait for internal metadata import
      ansible.builtin.include_tasks: tasks/wait_windows_operation.yml
      vars:
        wsus_operation_timeout: "{{ wsus_transfer_timeout | int }}"

    - name: Record successful metadata import using native Ansible
      ansible.windows.win_copy:
        content: "{{ wsus_manifest.metadata.sha256 }}"
        dest: "{{ wsus_import_root }}\\{{ wsus_snapshot_reference.snapshot }}\\imported.sha256"
      no_log: "{{ wsus_no_log | bool }}"

    - name: Report imported snapshot
      ansible.builtin.debug:
        var: wsus_operation_status.result
      no_log: "{{ wsus_no_log | bool }}"

    - name: Inspect the saved internal patch ceiling
      ansible.windows.win_stat:
        path: "{{ wsus_state_root }}\\patch-month-policy.json"
      register: wsus_saved_patch_ceiling
      no_log: "{{ wsus_no_log | bool }}"

    - name: Reapply an active ceiling after metadata import
      when: wsus_saved_patch_ceiling.stat.exists
      block:
        - name: Read the previously verified patch ceiling
          ansible.builtin.slurp:
            src: "{{ wsus_state_root }}\\patch-month-policy.json"
          register: wsus_saved_patch_ceiling_file
          no_log: "{{ wsus_no_log | bool }}"

        - name: Decode the saved patch ceiling
          ansible.builtin.set_fact:
            wsus_saved_patch_ceiling_policy: "{{ wsus_saved_patch_ceiling_file.content | b64decode | from_json }}"
          no_log: "{{ wsus_no_log | bool }}"

        - name: Require the supported saved-ceiling format
          ansible.builtin.assert:
            that: wsus_saved_patch_ceiling_policy.schema_version == 1

        - name: Enforce the saved ceiling against newly imported catalogue entries
          ansible.builtin.include_tasks: tasks/apply_wsus_patch_month.yml
          vars:
            wsus_patch_policy_month: "{{ wsus_saved_patch_ceiling_policy.patch_month }}"
