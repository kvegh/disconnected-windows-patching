---
- name: Check external WSUS readiness without downloading updates
  hosts: wsus_external
  gather_facts: false
  tasks:
    - name: Require exactly one external WSUS server
      ansible.builtin.assert:
        that: groups.get('wsus_external', []) | length == 1

    - name: Read installed WSUS features with a native module
      ansible.windows.win_feature_info:
        name: UpdateServices*
      register: wsus_feature_information

    - name: Read the WSUS service without changing it
      ansible.windows.win_service_info:
        name: WsusService
      register: wsus_service_information

    - name: Read the configured WSUS content path
      ansible.windows.win_reg_stat:
        path: 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup'
        name: ContentDir
      register: wsus_setup_registry

    - name: Report installed WSUS components before readiness checks
      ansible.builtin.debug:
        msg:
          InstalledFeatures: "{{ wsus_feature_information.features | selectattr('installed') | map(attribute='name') | list }}"
          WsusServicePresent: "{{ wsus_service_information.exists }}"
          ContentPathConfigured: "{{ wsus_setup_registry.exists | default(false) }}"

    - name: Require WSUS services and its management API before querying updates
      ansible.builtin.assert:
        that:
          - wsus_service_information.exists
          - "'UpdateServices-Services' in installed_features"
          - "'UpdateServices-API' in installed_features"
          - wsus_setup_registry.exists | default(false)
        fail_msg: WSUS is not initialized with its management API; run repository preparation and WSUS setup first.
      vars:
        installed_features: "{{ wsus_feature_information.features | selectattr('installed') | map(attribute='name') | list }}"

    - name: Inspect WSUS, storage, services and outbound connectivity
      ansible.windows.win_powershell:
        error_action: stop
        parameters:
          MinimumFreeGB: "{{ wsus_minimum_free_gb | default(8) | int }}"
        script: |
          param([int]$MinimumFreeGB)
          $Ansible.Changed = $false
          Import-Module UpdateServices
          $server = Get-WsusServer
          $config = $server.GetConfiguration()
          $content = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup').ContentDir
          if (-not (Test-Path -LiteralPath $content)) { throw 'WSUS content directory is missing.' }
          $drive = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$([IO.Path]::GetPathRoot($content).TrimEnd('\'))'"
          $services = @{}
          foreach ($name in @('WsusService', 'W3SVC', 'BITS')) {
              $service = Get-Service $name
              $services[$name] = [string]$service.Status
              if ($name -ne 'BITS' -and $service.Status -ne 'Running') { throw "Required service is not running: $name" }
              if ($service.StartType -eq 'Disabled') { throw "Required service is disabled: $name" }
          }
          if ($config.IsReplicaServer -or -not $config.SyncFromMicrosoftUpdate -or $config.HostBinariesOnMicrosoftUpdate) {
              throw 'WSUS must be autonomous, synchronize from Microsoft, and store content locally.'
          }
          if ($drive.FreeSpace -lt ($MinimumFreeGB * 1GB)) { throw 'Insufficient free space for the configured demo minimum.' }
          $endpoints = @{}
          foreach ($entry in @(@{Host='sws.update.microsoft.com';Port=443}, @{Host='download.windowsupdate.com';Port=80})) {
              $null = Resolve-DnsName $entry.Host -ErrorAction Stop
              $connected = Test-NetConnection $entry.Host -Port $entry.Port -InformationLevel Quiet -WarningAction SilentlyContinue
              $endpoints["$($entry.Host):$($entry.Port)"] = [bool]$connected
              if (-not $connected) { throw "Microsoft connectivity failed: $($entry.Host):$($entry.Port)" }
          }
          $utility = Join-Path $env:ProgramFiles 'Update Services\Tools\WsusUtil.exe'
          if (-not (Test-Path -LiteralPath $utility)) { throw 'WSUS export/import utility is missing.' }
          $scope = New-Object Microsoft.UpdateServices.Administration.UpdateScope
          $catalogCount = $server.GetUpdateCount($scope)
          $scope.ApprovedStates = [Microsoft.UpdateServices.Administration.ApprovedStates]::LatestRevisionApproved
          $approved = @($server.GetUpdates($scope))
          $ready = @($approved | Where-Object { [string]$_.State -eq 'Ready' -and -not $_.IsDeclined })
          $Ansible.Result = @{
              Ready = $true
              CatalogUpdates = $catalogCount
              ApprovedUpdates = $approved.Count
              ApprovedReadyUpdates = $ready.Count
              ClientApplicabilityAssessed = $false
              FreeGB = [math]::Round($drive.FreeSpace / 1GB, 2)
              Services = $services
              Endpoints = $endpoints
              ProductsSelected = @($server.GetSubscription().GetUpdateCategories() | ForEach-Object Title)
              LastSync = [string]$server.GetSubscription().GetLastSynchronizationInfo().Result
              PendingDownloadBytes = $server.GetContentDownloadProgress().TotalBytesToDownload - $server.GetContentDownloadProgress().DownloadedBytes
          }
      register: wsus_prerequisites

    - name: Report external WSUS readiness
      ansible.builtin.debug:
        var: wsus_prerequisites.result

    - name: Validate pipeline scripts with the Windows PowerShell parser
      ansible.windows.win_powershell:
        error_action: stop
        parameters:
          Source: "{{ lookup('ansible.builtin.file', item) }}"
        script: |
          param([string]$Source)
          $Ansible.Changed = $false
          $tokens = $null
          $parseErrors = $null
          $null = [Management.Automation.Language.Parser]::ParseInput($Source, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors.Message -join '; ') }
          $Ansible.Result = 'PowerShell syntax valid'
      loop:
        - assets/sync-external-wsus.ps1
        - assets/export-external-wsus.ps1
        - assets/prepare-wsus-import.ps1
        - assets/import-wsus-metadata.ps1
        - assets/validate-chocolatey-export.ps1
        - assets/upload-nexus-package.ps1
