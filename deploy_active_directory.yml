---
- name: Promote the dedicated patched guest and install its regional directory
  hosts: all
  gather_facts: false
  serial: 1
  vars_files:
    - vars/active_directory_vault.yml
    - vars/active_directory_connection.yml
  vars:
    ansible_user: "{{ active_directory.bootstrap_username }}"
    ansible_password: "{{ active_directory.bootstrap_password }}"
  tasks:
    - name: Require exactly one dedicated domain controller
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - active_directory.hostname is match('^[A-Za-z][A-Za-z0-9-]{0,14}$')
          - active_directory.prefix is match('^[A-Za-z][A-Za-z0-9-]{0,7}$')
      no_log: true

    - name: Connect safely before, during or after domain promotion
      ansible.builtin.include_tasks: tasks/connect_active_directory_guest.yml

    - name: Verify guest identity, current membership and expected management address
      # Platform/API reason: [rationale](docs/supporting-code.md#active-directory-and-aap-verification).
      ansible.windows.win_powershell:
        parameters:
          Hostname: "{{ active_directory.hostname }}"
          Domain: "{{ active_directory.dns_domain }}"
          Address: "{{ active_directory.ipv4 }}"
        script: |
          # Language choice: [rationale](docs/supporting-code.md#active-directory-and-aap-verification).
          param([string]$Hostname,[string]$Domain,[string]$Address)
          $cs = Get-CimInstance Win32_ComputerSystem
          if ($cs.Name -ne $Hostname) { throw 'Unexpected Windows hostname.' }
          if ($cs.PartOfDomain -and $cs.Domain -ne $Domain) { throw 'The guest belongs to a different domain.' }
          if (-not (Get-NetIPAddress -AddressFamily IPv4 | Where-Object IPAddress -eq $Address)) { throw 'Unexpected management address.' }
          $Ansible.Changed = $false
          $Ansible.Result = @{ IsDomainController=($cs.DomainRole -in @(4,5)) }
      register: ad_guest_state
      no_log: true

    - name: Require an existing controller for identity-only configuration
      ansible.builtin.assert:
        that: ad_guest_state.result.IsDomainController
        fail_msg: Identity-only configuration requires the already-promoted dedicated controller.
      when: ad_identities_only | default(false) | bool

    - name: Complete an explicitly requested recovery restart after interrupted promotion
      ansible.windows.win_reboot:
        reboot_timeout: 1200
        post_reboot_delay: 30
      when:
        - not (ad_identities_only | default(false) | bool)
        - ad_complete_promotion_reboot | default(false) | bool
        - ad_guest_state.result.IsDomainController

    - name: Set the future domain administrator password before promotion
      ansible.windows.win_user:
        name: Administrator
        password: "{{ active_directory.domain_admin_password }}"
        account_disabled: false
        state: present
      when: not ad_guest_state.result.IsDomainController
      no_log: true

    - name: Update the management password when bootstrapping as Administrator
      ansible.builtin.set_fact:
        ansible_password: "{{ active_directory.domain_admin_password }}"
      when:
        - not ad_guest_state.result.IsDomainController
        - active_directory.bootstrap_username | lower | regex_replace('^.*[\\\\/]', '') == 'administrator'
      no_log: true

    - name: Reconnect using the selected administrator password before installing roles
      ansible.builtin.meta: reset_connection

    - name: Install AD DS, DNS and the supported Windows administration cmdlets
      ansible.windows.win_feature:
        name: [AD-Domain-Services, DNS]
        include_management_tools: true
        state: present
      register: ad_features
      when: not (ad_identities_only | default(false) | bool)

    - name: Complete required feature installation reboot
      ansible.windows.win_reboot:
        reboot_timeout: 1200
      when:
        - not (ad_identities_only | default(false) | bool)
        - ad_features.reboot_required

    - name: Create the requested new forest without bypassing prerequisite checks
      microsoft.ad.domain:
        dns_domain_name: "{{ active_directory.dns_domain }}"
        domain_netbios_name: "{{ active_directory.netbios }}"
        domain_mode: Win2025
        forest_mode: Win2025
        install_dns: true
        create_dns_delegation: false
        safe_mode_password: "{{ active_directory.dsrm_password }}"
        reboot: true
        reboot_timeout: 1200
      register: ad_promotion
      when: not (ad_identities_only | default(false) | bool)
      no_log: true

    - name: Use the protected domain administrator for subsequent management
      ansible.builtin.set_fact:
        ansible_user: "{{ active_directory.domain_admin_username }}"
        ansible_password: "{{ active_directory.domain_admin_password }}"
      no_log: true

    - name: Reset the management connection after promotion
      ansible.builtin.meta: reset_connection

    - name: Wait for the promoted domain controller
      ansible.builtin.wait_for_connection:
        timeout: 1200

    - name: Use AD-integrated DNS on the domain controller
      ansible.windows.win_dns_client:
        adapter_names: '*'
        dns_servers: ["{{ active_directory.ipv4 }}"]
      when: not (ad_identities_only | default(false) | bool)
      no_log: true

    - name: Wait for AD Web Services and SYSVOL readiness
      # Platform/API reason: [rationale](docs/supporting-code.md#active-directory-and-aap-verification).
      ansible.windows.win_powershell:
        parameters:
          Domain: "{{ active_directory.dns_domain }}"
        sensitive_parameters:
          - name: DomainCredential
            username: "{{ active_directory.domain_admin_username }}"
            password: "{{ active_directory.domain_admin_password }}"
        script: |
          # Language choice: [rationale](docs/supporting-code.md#active-directory-and-aap-verification).
          param([string]$Domain,[PSCredential]$DomainCredential)
          $Ansible.Changed = $false
          try {
              Import-Module ActiveDirectory
              $d = Get-ADDomain -Server localhost -Credential $DomainCredential -ErrorAction Stop
              $Ansible.Result = @{ Ready=($d.DNSRoot -eq $Domain -and (Test-Path "$env:SystemRoot\SYSVOL\domain")) }
          } catch { $Ansible.Result = @{ Ready=$false } }
      register: ad_directory_ready
      until: ad_directory_ready.result.Ready | default(false) | bool
      retries: 30
      delay: 10
      no_log: true

    - name: Configure and verify the new forest-root time authority
      ansible.builtin.include_tasks: tasks/configure_active_directory_time.yml
      when: not (ad_identities_only | default(false) | bool)

    - name: Parse the directory and optional test scripts before any identity changes
      # Platform/API reason: [rationale](docs/supporting-code.md#active-directory-and-aap-verification).
      ansible.windows.win_powershell:
        parameters:
          Sources: >-
            {{ [lookup('ansible.builtin.file', 'assets/configure-active-directory-identities.ps1')]
               + ([lookup('ansible.builtin.file', 'assets/verify-active-directory-additional-members.ps1')]
                  if ad_verify_additional_members | default(false) | bool else []) }}
        script: |
          # Language choice: [rationale](docs/supporting-code.md#active-directory-and-aap-verification).
          param([string[]]$Sources)
          foreach ($source in $Sources) {
              $tokens = $null
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors.Count -gt 0) { throw 'A directory script failed PowerShell syntax validation.' }
          }
          $Ansible.Changed = $false
      no_log: true

    - name: Require focused identity mode for the optional additional-member test
      ansible.builtin.assert:
        that:
          - ad_identities_only | default(false) | bool
          - not (ad_reset_demo_user_passwords | default(false) | bool)
        fail_msg: The additional-member test requires identity-only mode without password resets.
        quiet: true
      when: ad_verify_additional_members | default(false) | bool

    - name: Reconcile seeded identities and optionally prove additional-member preservation
      block:
        - name: Prepare temporary additional AD members for the opt-in integration test
          ansible.builtin.include_tasks: tasks/verify_active_directory_additional_members.yml
          vars:
            ad_extra_member_phase: prepare
          when: ad_verify_additional_members | default(false) | bool

        - name: Configure owned identities while preserving additional AD members
          ansible.builtin.include_tasks: tasks/configure_active_directory_identities.yml

        - name: Reconcile a second time for the opt-in preservation test
          ansible.builtin.include_tasks: tasks/configure_active_directory_identities.yml
          when: ad_verify_additional_members | default(false) | bool

        - name: Require the second identity reconciliation to be unchanged
          ansible.builtin.assert:
            that: not ad_identities.changed
            fail_msg: The second identity reconciliation unexpectedly changed managed state.
            quiet: true
          when: ad_verify_additional_members | default(false) | bool

        - name: Verify the additional identities and their direct and nested memberships
          ansible.builtin.include_tasks: tasks/verify_active_directory_additional_members.yml
          vars:
            ad_extra_member_phase: verify
          when: ad_verify_additional_members | default(false) | bool
      always:
        - name: Remove only temporary objects created by this additional-member test
          ansible.builtin.include_tasks: tasks/verify_active_directory_additional_members.yml
          vars:
            ad_extra_member_phase: cleanup
          when:
            - ad_verify_additional_members | default(false) | bool
            - (ad_extra_member_fixture | default({})).get('Created', false) | bool

    - name: Save additional-member preservation proof without identities or passwords
      ansible.builtin.set_stats:
        data:
          active_directory_additional_member_verification: >-
            {{ ad_extra_member_verification | combine({'TemporaryObjectsRemoved': ad_extra_member_cleanup_verified | bool,
                 'SecondReconciliationChanged': ad_identities.changed | bool}) }}
        aggregate: false
      when: ad_verify_additional_members | default(false) | bool

    - name: Save identity verification without credentials
      ansible.builtin.set_stats:
        data:
          active_directory_identity_verification: "{{ ad_identities.result }}"
        aggregate: false

    - name: Report verified regional identity setup
      ansible.builtin.debug:
        msg: Four actor countries and three roles are verified; Denmark, Norway and Hungary inherit EU-approved access, while New Zealand remains isolated.
