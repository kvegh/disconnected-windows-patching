---
- name: Independently verify regional AAP resource grants and optional LDAP logins
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/active_directory_vault.yml
    - vars/active_directory_target.yml
  tasks:
    - name: Check the selected target credential before reading platform access
      ansible.builtin.include_tasks: tasks/require_active_directory_target.yml

    - name: Check exact resource scopes and optionally exercise real login permissions
      # Platform/API reason: [rationale](docs/supporting-code.md#active-directory-and-aap-verification).
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/assets/verify-aap-ad-regions.py"]
        stdin: >-
          {{ {'url': ad_target_api_url,
              'ca': ad_target_api_ca,
              'admin_username': 'admin',
              'admin_password': ad_target_admin_password,
              'prefix': active_directory.prefix,
              'users': active_directory.users,
              'resource_sets': active_directory.resource_sets,
              'retired_users': active_directory.retired_users,
              'verify_logins': ad_verify_ldap_logins | default(false) | bool} | to_json }}
      register: ad_rbac_verification
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require successful verification while keeping credential input protected
      ansible.builtin.assert:
        that: ad_rbac_verification.rc == 0
        fail_msg: "{{ (ad_rbac_verification.stdout | default('{}', true) | from_json).reason | default('Protected verification failed.') }}"
        quiet: true

    - name: Report non-sensitive verification counts
      ansible.builtin.debug:
        msg: "{{ ad_rbac_verification.stdout | from_json }}"
