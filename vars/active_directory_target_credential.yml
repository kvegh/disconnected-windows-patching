---
ad_target_credential_type:
  name: Windows AD AAP Target
  kind: cloud
  inputs:
    fields:
      - {id: target_url, label: Target AAP HTTPS URL, type: string}
      - {id: admin_password, label: Target AAP administrator password, type: string, secret: true}
      - {id: ca_bundle, label: Verified target CA bundle, type: string, multiline: true}
      - {id: ssh_username, label: Target SSH account, type: string}
      - {id: ssh_password, label: Target SSH password, type: string, secret: true}
      - {id: ssh_known_hosts, label: Verified target public SSH keys, type: string, multiline: true}
      - {id: install_username, label: Target service account, type: string}
    required: [target_url, admin_password, ca_bundle, ssh_username, ssh_password, ssh_known_hosts, install_username]
  injectors:
    file:
      template: !unsafe '{{ ca_bundle }}'
    env:
      AD_AAP_TARGET_URL: !unsafe '{{ target_url }}'
      AD_AAP_TARGET_ADMIN_PASSWORD: !unsafe '{{ admin_password }}'
      AD_AAP_TARGET_CA_FILE: !unsafe '{{ tower.filename }}'
      AD_AAP_TARGET_SSH_USERNAME: !unsafe '{{ ssh_username }}'
      AD_AAP_TARGET_SSH_PASSWORD: !unsafe '{{ ssh_password }}'
      AD_AAP_TARGET_SSH_KNOWN_HOSTS: !unsafe '{{ ssh_known_hosts }}'
      AD_AAP_TARGET_INSTALL_USERNAME: !unsafe '{{ install_username }}'
