---
# Collections of the job templates (installed by the AAP project sync) and of
# playbooks/aap-infra.yml. Resolved through the AAP's automation hub; the hub
# endpoint and its credentials are AAP configuration, not repository content.
collections:
  - name: ansible.windows
    version: 3.8.0
  - name: community.windows
    version: 3.3.0
  - name: chocolatey.chocolatey
    version: 1.5.3
  - name: microsoft.iis
    version: 1.3.0
  # Only playbooks/aap-infra.yml (network role on the AAP VM). Same pin as the
  # AutoDeploy deployer project, whose job runs that playbook.
  - name: redhat.rhel_system_roles
    version: 1.120.5
  # Only playbooks/aap-infra.yml (the AAP VM's DHCP address on the
  # hypervisor). Same pin as the AutoDeploy deployer project.
  - name: community.libvirt
    version: 2.4.0
