---
- name: Inspect Windows network bootstrap without changing configuration
  hosts: wsus_external:wsus_internal:windows_managed
  gather_facts: false
  pre_tasks:
    - name: Load the explicitly selected private Windows runtime profile
      ansible.builtin.include_tasks: tasks/windows_runtime_settings.yml
      when: windows_runtime_settings_vault is defined
      tags: always

  tasks:
    - name: Wait for existing WinRM connectivity
      ansible.builtin.wait_for_connection:
        timeout: 180

    - name: Inspect the bootstrap scheduled task
      community.windows.win_scheduled_task_stat:
        name: AAP-ConfigurePermanentNetwork

    - name: Inspect saved network configuration result
      ansible.windows.win_stat:
        path: 'C:\ProgramData\AAP\NetworkConfiguration\result.json'
      register: network_result_file

    - name: Read saved network configuration result
      ansible.builtin.slurp:
        src: 'C:\ProgramData\AAP\NetworkConfiguration\result.json'
      register: network_result_content
      when: network_result_file.stat.exists

    - name: Report saved network result
      ansible.builtin.debug:
        msg: "{{ network_result_content.content | b64decode | from_json }}"
      when: network_result_file.stat.exists

    - name: Inspect current adapters, addresses and routes
      # Platform/API reason: [rationale](docs/supporting-code.md#windows-inspection-and-evidence).
      ansible.windows.win_powershell:
        depth: 6
        script: |
          # Language choice: [rationale](docs/supporting-code.md#windows-inspection-and-evidence).
          $Ansible.Changed = $false
          $licenseFilter = "ApplicationID='55c92734-d682-4d71-983e-d6ec3f16059f' AND PartialProductKey IS NOT NULL"
          $version = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $os = Get-CimInstance Win32_OperatingSystem
          $updateSnapshots = @()
          foreach ($sample in 1..2) {
              $pipes = @{ Available=$false; Names=@() }
              try {
                  # Names only: never connect to or consume a live worker's progress pipe.
                  $names = @(Get-ChildItem -LiteralPath '\\.\pipe\' -ErrorAction Stop |
                      Where-Object Name -Like 'Ansible.Windows.WinUpdates-*' | ForEach-Object Name)
                  $pipes = @{ Available=$true; Names=$names }
              } catch { $pipes = @{ Available=$false; Names=@(); ErrorCode=$_.Exception.HResult } }
              $updateSnapshots += @{
                  Utc=[DateTime]::UtcNow.ToString('o')
                  NativeUpdatePipes=$pipes
                  Workers=@(Get-Process -Name TiWorker,TrustedInstaller,MoUsoCoreWorker,wuauclt,powershell,pwsh,msiexec -ErrorAction SilentlyContinue |
                      Where-Object Id -NE $PID | Select-Object Name,Id,CPU,WorkingSet64,StartTime)
                  Services=@(Get-CimInstance Win32_Service |
                      Where-Object Name -In @('wuauserv','BITS','UsoSvc','DoSvc') | Select-Object Name,State,ProcessId)
              }
              if ($sample -eq 1) { Start-Sleep -Seconds 10 }
          }
          $Ansible.Result = @{
              ComputerUuid = (Get-CimInstance Win32_ComputerSystemProduct).UUID
              Utc = [DateTime]::UtcNow.ToString('o')
              TimeZone = (Get-TimeZone).Id
              Build = "$($version.CurrentBuildNumber).$($version.UBR)"
              Boot = $os.LastBootUpTime
              UpdateSnapshots = $updateSnapshots
              PendingReboot = (
                  (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending') -or
                  (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired')
              )
              Licenses = @(Get-CimInstance SoftwareLicensingProduct -Filter $licenseFilter |
                  Select-Object Name, LicenseStatus, GracePeriodRemaining)
              ShutdownEvents = @(Get-WinEvent -FilterHashtable @{LogName='System';Id=1074,6006,6008} -MaxEvents 12 -ErrorAction SilentlyContinue |
                  Select-Object TimeCreated, Id, ProviderName, Message)
              Adapters = @(Get-NetAdapter | Select-Object Name, MacAddress, Status)
              Addresses = @(Get-NetIPAddress -AddressFamily IPv4 | Select-Object InterfaceAlias, IPAddress, PrefixLength, AddressState)
              Interfaces = @(Get-NetIPInterface -AddressFamily IPv4 | Select-Object InterfaceAlias, Dhcp, Forwarding)
              Defaults = @(Get-NetRoute -AddressFamily IPv4 -DestinationPrefix '0.0.0.0/0' -ErrorAction SilentlyContinue |
                  Select-Object InterfaceAlias, NextHop)
          }
      register: windows_readonly_inspection
      no_log: true

    - name: Save protected read-only network and shutdown diagnostics
      ansible.builtin.set_stats:
        data:
          windows_readonly_inspection: "{{ {inventory_hostname: windows_readonly_inspection.result} }}"
        aggregate: true
      no_log: true
