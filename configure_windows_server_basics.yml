---
- name: Validate Windows basics inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require repository servers and managed clients
      ansible.builtin.assert:
        that:
          - groups.get('wsus_external', []) | length == 1
          - groups.get('wsus_internal', []) | length == 1
          - groups.get('windows_managed', []) | length >= 1
          - groups['wsus_external'] | intersect(groups['wsus_internal']) | length == 0
          - (groups['wsus_external'] + groups['wsus_internal']) | intersect(groups['windows_managed']) | length == 0
        fail_msg: >-
          Supply disjoint wsus_external, wsus_internal and windows_managed groups.

- name: Configure permanent Windows networking and guest identity
  hosts: wsus_external:wsus_internal:windows_managed
  gather_facts: false
  vars:
    windows_network_task_name: AAP-ConfigurePermanentNetwork
    windows_network_task_directory: 'C:\ProgramData\AAP\NetworkConfiguration'
  tasks:
    - name: Wait for WinRM
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Check Ansible Windows execution
      ansible.windows.win_ping:

    - name: Require permanent network settings
      ansible.builtin.assert:
        that:
          - windows_network_interfaces | default([]) | length > 0
          - windows_connection_address | default('') | length > 0
          - windows_connection_address in (windows_network_interfaces | map(attribute='ipv4_address') | list)
          - windows_network_interfaces | map(attribute='mac') | unique | length == windows_network_interfaces | length
          - windows_network_interfaces | map(attribute='name') | unique | length == windows_network_interfaces | length
        fail_msg: Supply per-host windows_network_interfaces and windows_connection_address through protected inventory variables.
      no_log: "{{ windows_no_log | default(wsus_no_log | default(true)) | bool }}"

    - name: Validate each desired interface
      ansible.builtin.assert:
        that:
          - item.mac is match('(?i)^([0-9a-f]{2}:){5}[0-9a-f]{2}$')
          - item.name | length > 0
          - item.ipv4_address | length > 0
          - item.prefix_length | int >= 1
          - item.prefix_length | int <= 32
          - item.gateway is defined
          - item.dns_servers is defined
          - item.dns_servers is sequence and item.dns_servers is not string
          - inventory_hostname in groups['wsus_external'] or not item.gateway
          - inventory_hostname in groups['wsus_external'] or item.dns_servers | length == 0
        fail_msg: Supply MAC, adapter name, IPv4 address/prefix, gateway (empty for none), and DNS list. Only external WSUS may have a gateway or DNS.
      loop: "{{ windows_network_interfaces }}"
      no_log: "{{ windows_no_log | default(wsus_no_log | default(true)) | bool }}"

    - name: Validate MAC matches and addresses before changing networking
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', 'assets/configure-static-network.ps1') }}"
        error_action: stop
        parameters:
          ConfigurationJson: "{{ windows_network_interfaces | to_json }}"
          ValidateOnly: true
      no_log: "{{ windows_no_log | default(wsus_no_log | default(true)) | bool }}"

    - name: Remove an earlier network task before preparing this run
      community.windows.win_scheduled_task:
        name: "{{ windows_network_task_name }}"
        state: absent
      when: not ansible_check_mode

    - name: Create local network configuration directory
      ansible.windows.win_file:
        path: "{{ windows_network_task_directory }}"
        state: directory
      when: not ansible_check_mode

    - name: Allow only administrators and SYSTEM to manage network task files
      ansible.windows.win_acl:
        path: "{{ windows_network_task_directory }}"
        user: "{{ item }}"
        rights: FullControl
        type: allow
        state: present
        inherit: ContainerInherit, ObjectInherit
      loop: [SYSTEM, 'BUILTIN\Administrators']
      when: not ansible_check_mode

    - name: Remove inherited permissions from network configuration directory
      ansible.windows.win_acl_inheritance:
        path: "{{ windows_network_task_directory }}"
        state: absent
        reorganize: false
      when: not ansible_check_mode

    - name: Copy the validated network configuration script
      ansible.windows.win_copy:
        src: assets/configure-static-network.ps1
        dest: "{{ windows_network_task_directory }}\\configure-static-network.ps1"
      when: not ansible_check_mode

    - name: Write protected network inputs for the scheduled task
      ansible.windows.win_copy:
        content: "{{ {'interfaces': windows_network_interfaces, 'disable_forwarding': inventory_hostname in groups['wsus_internal']} | to_json }}"
        dest: "{{ windows_network_task_directory }}\\configuration.json"
      no_log: "{{ windows_no_log | default(wsus_no_log | default(true)) | bool }}"
      when: not ansible_check_mode

    - name: Copy the scheduled network task runner
      ansible.windows.win_copy:
        src: assets/run-network-configuration.ps1
        dest: "{{ windows_network_task_directory }}\\run-network-configuration.ps1"
      when: not ansible_check_mode

    - name: Remove stale network task results
      ansible.windows.win_file:
        path: "{{ windows_network_task_directory }}\\result.json"
        state: absent
      when: not ansible_check_mode

    - name: Apply permanent networking through Windows Task Scheduler
      community.windows.win_scheduled_task:
        name: "{{ windows_network_task_name }}"
        description: Configure the demo-owned NICs independently of the WinRM session.
        username: SYSTEM
        logon_type: service_account
        run_level: highest
        actions:
          - path: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
            arguments: '-NoProfile -NonInteractive -File "{{ windows_network_task_directory }}\run-network-configuration.ps1"'
            working_directory: "{{ windows_network_task_directory }}"
        triggers:
          - type: registration
            delay: PT20S
        execution_time_limit: PT3M
        multiple_instances: 2
        enabled: true
        state: present
      when: not ansible_check_mode
      no_log: "{{ windows_no_log | default(wsus_no_log | default(true)) | bool }}"

    - name: Use permanent address for the remainder of this job
      ansible.builtin.set_fact:
        ansible_host: "{{ windows_connection_address }}"
      when: not ansible_check_mode
      no_log: "{{ windows_no_log | default(wsus_no_log | default(true)) | bool }}"

    - name: Reset connection after network configuration starts
      ansible.builtin.meta: reset_connection
      when: not ansible_check_mode

    - name: Reconnect at the permanent address
      ansible.builtin.wait_for_connection:
        delay: 35
        timeout: 300
      when: not ansible_check_mode

    - name: Initialize bounded network task polling
      ansible.builtin.set_fact:
        windows_network_poll_attempt: 0
        windows_network_task_complete: false
      when: not ansible_check_mode

    - name: Wait for the scheduled network task with WinRM reconnection
      ansible.builtin.include_tasks: tasks/wait_for_network_task.yml
      when: not ansible_check_mode

    - name: Require successful task completion after network polling
      ansible.builtin.assert:
        that: windows_network_task_complete | bool
        fail_msg: Network task did not complete within the bounded polling period.
      when: not ansible_check_mode
      no_log: "{{ windows_no_log | default(wsus_no_log | default(true)) | bool }}"

    - name: Inspect the scheduled network task result file
      ansible.windows.win_stat:
        path: "{{ windows_network_task_directory }}\\result.json"
      register: windows_network_result_stat
      when: not ansible_check_mode

    - name: Require a completed network configuration result
      ansible.builtin.assert:
        that:
          - windows_network_result_stat.stat.exists
        fail_msg: "Network task produced no result; process exit code {{ windows_network_task_status.state.last_task_result }}."
      when: not ansible_check_mode

    - name: Read the network configuration result
      ansible.builtin.slurp:
        src: "{{ windows_network_task_directory }}\\result.json"
      register: windows_network_result_file
      no_log: "{{ windows_no_log | default(wsus_no_log | default(true)) | bool }}"
      when: not ansible_check_mode

    - name: Confirm permanent network configuration succeeded
      ansible.builtin.assert:
        that:
          - network_result.success | bool
          - windows_network_task_status.state.last_task_result == 0
        fail_msg: "{{ network_result.error | default('Network configuration failed.') }}"
        success_msg: Permanent network configuration completed successfully.
      vars:
        network_result: "{{ windows_network_result_file.content | b64decode | from_json }}"
      changed_when: network_result.changed | default(false) | bool
      no_log: "{{ windows_no_log | default(wsus_no_log | default(true)) | bool }}"
      when: not ansible_check_mode

    - name: Remove the completed network task
      community.windows.win_scheduled_task:
        name: "{{ windows_network_task_name }}"
        state: absent
      when: not ansible_check_mode

    - name: Remove temporary network configuration files
      ansible.windows.win_file:
        path: "{{ windows_network_task_directory }}"
        state: absent
      when: not ansible_check_mode
      no_log: "{{ windows_no_log | default(wsus_no_log | default(true)) | bool }}"

    - name: Configure DNS with the Windows DNS client module
      ansible.windows.win_dns_client:
        adapter_names:
          - "{{ item.name }}"
        dns_servers: "{{ item.dns_servers }}"
      loop: "{{ windows_network_interfaces }}"
      no_log: "{{ windows_no_log | default(wsus_no_log | default(true)) | bool }}"
      when: not ansible_check_mode

    - name: Disable IP routing on internal repository server
      ansible.windows.win_regedit:
        path: 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
        name: IPEnableRouter
        data: 0
        type: dword
      when: inventory_hostname in groups['wsus_internal']

    - name: Set unique Windows hostname when supplied
      ansible.windows.win_hostname:
        name: "{{ windows_hostname }}"
      register: hostname_result
      when: windows_hostname is defined

    - name: Reboot after hostname change
      ansible.windows.win_reboot:
        reboot_timeout: 900
      when: hostname_result.reboot_required | default(false)
