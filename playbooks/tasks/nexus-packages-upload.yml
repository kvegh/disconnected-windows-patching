---
# Upload the pinned Chocolatey packages that the local Nexus feed still lacks.
# Runs on a repository server. Needs upload_package_dir (folder with
# <id>.<version>.nupkg files), nexus_port, nexus_feed_name,
# chocolatey_packages, nexus_admin_password.
#
# Gap: win_uri cannot send multipart bodies and Windows PowerShell 5.1 has no
# -Form, so the Nexus Components API upload uses .NET HttpClient. (AAP-side
# ansible.builtin.uri is no option: it base64-encodes multipart file parts,
# which Nexus rejects with "Missing nuspec".)

- name: Look for the packages in the feed
  ansible.windows.win_uri:
    url: "http://localhost:{{ nexus_port }}/service/rest/v1/search?repository={{ nexus_feed_name }}&name={{ item.id }}&version={{ item.version }}"
    return_content: true
  loop: "{{ chocolatey_packages }}"
  loop_control:
    label: "{{ item.id }} {{ item.version }}"
  register: upload_search

- name: Upload the missing packages to the feed
  ansible.windows.win_powershell:
    parameters:
      Url: "http://localhost:{{ nexus_port }}/service/rest/v1/components?repository={{ nexus_feed_name }}"
      Path: "{{ upload_package_dir }}\\{{ item.item.id }}.{{ item.item.version }}.nupkg"
      Password: "{{ nexus_admin_password }}"
    script: |
      param([string]$Url, [string]$Path, [string]$Password)
      Add-Type -AssemblyName System.Net.Http
      $client = New-Object System.Net.Http.HttpClient
      $login = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("admin:$Password"))
      $client.DefaultRequestHeaders.Authorization = New-Object System.Net.Http.Headers.AuthenticationHeaderValue('Basic', $login)
      $form = New-Object System.Net.Http.MultipartFormDataContent
      $file = New-Object System.Net.Http.StreamContent([IO.File]::OpenRead($Path))
      $form.Add($file, 'nuget.asset', [IO.Path]::GetFileName($Path))
      $response = $client.PostAsync($Url, $form).Result
      if ([int]$response.StatusCode -ne 204) { throw "Upload of $Path failed: $([int]$response.StatusCode)" }
  loop: "{{ upload_search.results }}"
  loop_control:
    label: "{{ item.item.id }} {{ item.item.version }}"
  when: item.json['items'] | length == 0
  no_log: true
