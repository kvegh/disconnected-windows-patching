---
# Stage 4 (application part): repo-int pulls the application archive of
# repo-ext over HTTP, unpacks it and imports every package into its own
# Chocolatey feed (the managed servers install from there in stages 7 and 8).
# Credentials: the Windows machine credential and "Nexus admin".

- name: Import the application archive into the internal feed
  hosts: wsus_internal
  gather_facts: false
  vars:
    import_repo_ext: "{{ groups['wsus_external'][0] }}"
    import_archive_url: "http://{{ hostvars[import_repo_ext].ansible_host }}:{{ wsus_port }}/export/applications.zip"
    import_package_dir: "{{ repository_import_dir }}\\applications"
    import_nexus_api: "http://localhost:{{ nexus_port }}/service/rest/v1"
  tasks:
    - name: Read the checksum of the archive on repo-ext
      ansible.windows.win_stat:
        path: "{{ repository_export_dir }}\\applications.zip"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: "{{ import_repo_ext }}"
      register: import_archive

    - name: Create the import folder
      ansible.windows.win_file:
        path: "{{ repository_import_dir }}"
        state: directory

    - name: Download the application archive
      ansible.windows.win_get_url:
        url: "{{ import_archive_url }}"
        dest: "{{ repository_import_dir }}\\applications.zip"
        checksum: "{{ import_archive.stat.checksum }}"
        checksum_algorithm: sha256

    - name: Unpack the application archive
      community.windows.win_unzip:
        src: "{{ repository_import_dir }}\\applications.zip"
        dest: "{{ import_package_dir }}"
        creates: "{{ import_package_dir }}"

    - name: Look for the packages in the internal feed
      ansible.windows.win_uri:
        url: "{{ import_nexus_api }}/search?repository={{ nexus_feed_name }}&name={{ item.id }}&version={{ item.version }}"
        return_content: true
      loop: "{{ chocolatey_packages }}"
      loop_control:
        label: "{{ item.id }} {{ item.version }}"
      register: import_search

    # Gap: win_uri cannot send multipart bodies and Windows PowerShell 5.1 has
    # no -Form, so the Nexus Components API upload uses .NET HttpClient.
    - name: Upload the missing packages to the internal feed
      ansible.windows.win_powershell:
        parameters:
          Url: "{{ import_nexus_api }}/components?repository={{ nexus_feed_name }}"
          Path: "{{ import_package_dir }}\\{{ item.item.id }}.{{ item.item.version }}.nupkg"
          Password: "{{ nexus_admin_password }}"
        script: |
          param([string]$Url, [string]$Path, [string]$Password)
          Add-Type -AssemblyName System.Net.Http
          $client = New-Object System.Net.Http.HttpClient
          $login = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("admin:$Password"))
          $client.DefaultRequestHeaders.Authorization = New-Object System.Net.Http.Headers.AuthenticationHeaderValue('Basic', $login)
          $form = New-Object System.Net.Http.MultipartFormDataContent
          $file = New-Object System.Net.Http.StreamContent([IO.File]::OpenRead($Path))
          $form.Add($file, 'nuget.asset', [IO.Path]::GetFileName($Path))
          $response = $client.PostAsync($Url, $form).Result
          if ([int]$response.StatusCode -ne 204) { throw "Upload of $Path failed: $([int]$response.StatusCode)" }
      loop: "{{ import_search.results }}"
      loop_control:
        label: "{{ item.item.id }} {{ item.item.version }}"
      when: item.json['items'] | length == 0
      no_log: true
