---
- name: Require the protected internal WSUS URL for an unlicensed managed clone
  ansible.builtin.assert:
    that: wsus_internal_url | default('') is match('^https?://[^/\s]+/?$')
  when: inventory_hostname in groups.get('windows_managed', [])
  no_log: true

- name: Inspect existing managed Windows update sources before changing policies
  ansible.windows.win_reg_stat:
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    name: "{{ item }}"
  loop: [WUServer, WUStatusServer]
  register: windows_activation_sources_before
  when: inventory_hostname in groups.get('windows_managed', [])
  no_log: true

- name: Reject an explicitly configured conflicting managed update source
  ansible.builtin.assert:
    that: >-
      not item.exists | default(false) or
      item.value | default('') | length == 0 or
      item.value | lower | regex_replace('/+$', '') == wsus_internal_url | lower | regex_replace('/+$', '')
    fail_msg: A managed clone has an explicit conflicting WSUS source; review it before allowing activation connectivity.
  loop: "{{ windows_activation_sources_before.results | default([]) }}"
  when: inventory_hostname in groups.get('windows_managed', [])
  no_log: true

- name: Keep automatic Windows updates disabled during the activation exception
  ansible.windows.win_regedit:
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    name: NoAutoUpdate
    data: 1
    type: dword

- name: Establish missing managed update URLs before activation connectivity
  ansible.windows.win_regedit:
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    name: "{{ item.item }}"
    data: "{{ wsus_internal_url }}"
    type: string
  loop: "{{ windows_activation_sources_before.results | default([]) }}"
  when:
    - inventory_hostname in groups.get('windows_managed', [])
    - not item.exists | default(false) or item.value | default('') | length == 0
  no_log: true

- name: Require the internal managed update service before activation connectivity
  ansible.windows.win_regedit:
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    name: UseWUServer
    data: 1
    type: dword
  when: inventory_hostname in groups.get('windows_managed', [])

- name: Block the Windows Update client from using Internet update locations
  ansible.windows.win_regedit:
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    name: DoNotConnectToWindowsUpdateInternetLocations
    data: 1
    type: dword

- name: Prepare a unique live-only temporary NIC and bounded exposure guard
  ansible.builtin.set_fact:
    windows_activation_temporary_mac: "{{ '52:54:00:' ~ identifier[0:2] ~ ':' ~ identifier[2:4] ~ ':' ~ identifier[4:6] }}"
    windows_activation_guard_unit: "{{ 'aap-eval-activation-' ~ identifier }}"
    windows_activation_needs_nic: >-
      {{ not (windows_activation_before.result.existing_connected_access | bool and
              windows_activation_settings.libvirt_interfaces |
              selectattr('network', 'equalto', windows_activation_connected_network) | list | length > 0) }}
  vars:
    identifier: "{{ lookup('ansible.builtin.password', '/dev/null', length=12, chars=['hexdigits']) | lower }}"
  no_log: true

- name: Validate the selected existing activation network
  # Platform/API reason: [rationale](../docs/supporting-code.md#windows-networking-and-activation).
  ansible.builtin.command:
    argv: [virsh, --connect, 'qemu:///system', net-info, "{{ windows_activation_connected_network }}"]
  delegate_to: "{{ windows_activation_hypervisor }}"
  become: true
  environment:
    LC_ALL: C
  register: windows_activation_network_info
  changed_when: false
  failed_when: windows_activation_network_info.rc != 0 or windows_activation_network_info.stdout is not search('Active:\s+yes')
  when:
    - windows_activation_needs_nic | bool
    - windows_runtime_settings_vault is not defined
  no_log: true

- name: Verify the new NIC MAC is unused on this domain
  ansible.builtin.assert:
    that: >-
      windows_activation_temporary_mac not in
      ((windows_activation_domain_before.stdout | from_json).all_macs | default(
        (windows_activation_domain_before.stdout | from_json).live | map(attribute='mac') | list))
  when: windows_activation_needs_nic | bool
  no_log: true

- name: Prepare the same exact cleanup for the normal path and existing deadline
  # No certified module manages live-only libvirt NICs or nft rule handles.
  # Justification: [activation bounds](../docs/supporting-code.md#windows-networking-and-activation).
  ansible.builtin.set_fact:
    windows_activation_cleanup_script: |
      set -eu
      domain=$1
      mac=$2
      {% if windows_runtime_settings_vault is defined %}
      tag=$3
      network=$4
      restore_network=$5
      expected_uuid=$6
      expected_machine=$7
      test "$(cat /etc/machine-id)" = "$expected_machine"
      test "$(/usr/bin/virsh --connect qemu:///system domuuid "$domain")" = "$expected_uuid"
      {% endif %}
      interfaces=$(/usr/bin/virsh --connect qemu:///system domiflist "$domain")
      if printf '%s\n' "$interfaces" | /usr/bin/awk -v mac="$mac" '$5 == mac {found=1} END {exit !found}'; then
        /usr/bin/virsh --connect qemu:///system domif-setlink "$domain" "$mac" down --live
        /usr/bin/virsh --connect qemu:///system detach-interface "$domain" network --mac "$mac" --live
      fi
      {% if windows_runtime_settings_vault is defined %}
      rules=$(/usr/sbin/nft --json --handle list table inet hactar_recovery)
      deletions=$(printf '%s' "$rules" | /usr/bin/jq -r --arg tag "$tag" --arg mac "$mac" '
        .nftables[] | select(.rule) | .rule |
        select(.comment == $tag and (.chain == "guest_forward" or .chain == "guest_host")) |
        select(.expr | any(.match.left.payload.protocol == "ether" and
                          .match.left.payload.field == "saddr" and .match.right == $mac)) |
        "delete rule inet hactar_recovery \(.chain) handle \(.handle)"')
      if [ -n "$deletions" ]; then
        printf '%s\n' "$deletions" | /usr/sbin/nft --file -
      fi
      if [ "$restore_network" = yes ]; then
        domains=$(/usr/bin/virsh --connect qemu:///system list --all --name)
        for guest in $domains; do
          for mode in live inactive; do
            if [ "$mode" = inactive ]; then
              interfaces=$(/usr/bin/virsh --connect qemu:///system domiflist "$guest" --inactive)
            else
              interfaces=$(/usr/bin/virsh --connect qemu:///system domiflist "$guest")
            fi
            if printf '%s\n' "$interfaces" | /usr/bin/awk -v net="$network" '$2 == "network" && $3 == net {found=1} END {exit !found}'; then
              echo 'Refusing to stop an activation network now referenced by another adapter.' >&2
              exit 1
            fi
          done
        done
        active=$(/usr/bin/virsh --connect qemu:///system net-list --name)
        if printf '%s\n' "$active" | /usr/bin/awk -v net="$network" '$0 == net {found=1} END {exit !found}'; then
          /usr/bin/virsh --connect qemu:///system net-destroy "$network"
        fi
      fi
      {% endif %}
    windows_activation_cleanup_arguments: >-
      {{ [windows_activation_settings.vm_name, windows_activation_temporary_mac]
         + ([windows_activation_guard_unit, windows_activation_connected_network,
             'no' if domain.activation_network.active else 'yes', domain.uuid,
             windows_runtime_hypervisor.machine_id] if windows_runtime_settings_vault is defined else []) }}
  vars:
    domain: "{{ windows_activation_domain_before.stdout | from_json }}"
  when: windows_activation_needs_nic | bool
  no_log: true

- name: Perform the bounded activation exception with unconditional hypervisor cleanup
  block:
    - name: Arm a hypervisor deadline before exposing the temporary adapter
      # Platform/API reason: [rationale](../docs/supporting-code.md#windows-networking-and-activation).
      ansible.builtin.command:
        argv: >-
          {{ ['systemd-run', '--unit=' ~ windows_activation_guard_unit, '--on-active=900s',
              '--timer-property=AccuracySec=1s', '--property=Type=oneshot', '--property=TimeoutStartSec=60s',
              '/bin/sh', '-c', windows_activation_cleanup_script, '--'] + windows_activation_cleanup_arguments }}
      delegate_to: "{{ windows_activation_hypervisor }}"
      become: true
      changed_when: true
      when: windows_activation_needs_nic | bool
      no_log: true

    - name: Prepare only MAC-specific public HTTP HTTPS and gateway DNS rules
      ansible.builtin.set_fact:
        windows_activation_temporary_rules: |
          insert rule inet hactar_recovery guest_forward iifname "{{ network.bridge }}" \
            ether saddr {{ windows_activation_temporary_mac }} oifname != @guest_bridges \
            ip daddr != @installation_denied_v4 tcp dport { 80, 443 } accept comment "{{ windows_activation_guard_unit }}"
          insert rule inet hactar_recovery guest_forward iifname "{{ network.bridge }}" \
            ether saddr {{ windows_activation_temporary_mac }} ip daddr @installation_denied_v4 drop comment "{{ windows_activation_guard_unit }}"
          insert rule inet hactar_recovery guest_forward iifname "{{ network.bridge }}" \
            ether saddr {{ windows_activation_temporary_mac }} meta nfproto ipv6 drop comment "{{ windows_activation_guard_unit }}"
          insert rule inet hactar_recovery guest_host iifname "{{ network.bridge }}" \
            ether saddr {{ windows_activation_temporary_mac }} ip daddr {{ network.gateway }} udp dport 53 accept comment "{{ windows_activation_guard_unit }}"
          insert rule inet hactar_recovery guest_host iifname "{{ network.bridge }}" \
            ether saddr {{ windows_activation_temporary_mac }} ip daddr {{ network.gateway }} tcp dport 53 accept comment "{{ windows_activation_guard_unit }}"
      vars:
        network: "{{ (windows_activation_domain_before.stdout | from_json).activation_network }}"
      when: windows_runtime_settings_vault is defined
      no_log: true

    - name: Validate the temporary rules without applying permissions
      # Rule insertion has no suitable certified module; preserve the existing deny sets.
      # Justification: [activation bounds](../docs/supporting-code.md#windows-networking-and-activation).
      ansible.builtin.command:
        argv: [nft, --check, --file, '-']
        stdin: "{{ windows_activation_temporary_rules }}"
      delegate_to: "{{ windows_activation_hypervisor }}"
      become: true
      changed_when: false
      when: windows_runtime_settings_vault is defined
      no_log: true

    - name: Apply only the temporary MAC rules under the armed deadline
      # Justification: [activation bounds](../docs/supporting-code.md#windows-networking-and-activation).
      ansible.builtin.command:
        argv: [nft, --file, '-']
        stdin: "{{ windows_activation_temporary_rules }}"
      delegate_to: "{{ windows_activation_hypervisor }}"
      become: true
      changed_when: true
      when: windows_runtime_settings_vault is defined
      no_log: true

    - name: Start only the inspected unused activation network when initially inactive
      # Justification: [activation bounds](../docs/supporting-code.md#windows-networking-and-activation).
      ansible.builtin.command:
        argv: [virsh, --connect, 'qemu:///system', net-start, "{{ windows_activation_connected_network }}"]
      delegate_to: "{{ windows_activation_hypervisor }}"
      become: true
      changed_when: true
      when:
        - windows_runtime_settings_vault is defined
        - not (windows_activation_domain_before.stdout | from_json).activation_network.active | bool
      no_log: true

    - name: Attach only a live e1000e activation NIC while retaining every original adapter
      # Platform/API reason: [rationale](../docs/supporting-code.md#windows-networking-and-activation).
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - qemu:///system
          - attach-interface
          - "{{ windows_activation_settings.vm_name }}"
          - network
          - "{{ windows_activation_connected_network }}"
          - --model
          - e1000e
          - --mac
          - "{{ windows_activation_temporary_mac }}"
          - --live
      delegate_to: "{{ windows_activation_hypervisor }}"
      become: true
      changed_when: true
      when: windows_activation_needs_nic | bool
      no_log: true

    - name: Wait for temporary DHCP routing without altering permanent adapters
      # Platform/API reason: [rationale](../docs/supporting-code.md#windows-networking-and-activation).
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', 'assets/windows-evaluation-activation.ps1') }}"
        error_action: stop
        parameters:
          Mode: Connected
          ExpectedVersion: "{{ windows_activation_settings.windows_version | string }}"
          ConfigurationJson: "{{ windows_activation_settings | to_json }}"
          TemporaryMac: "{{ windows_activation_temporary_mac }}"
      register: windows_activation_connected
      until: windows_activation_connected is succeeded and not windows_activation_connected.unreachable | default(false)
      retries: 24
      delay: 5
      ignore_unreachable: true
      when: windows_activation_needs_nic | bool
      no_log: true

    - name: Require Windows reachability before activation
      ansible.builtin.assert:
        that: not windows_activation_connected.unreachable | default(false)
      when: windows_activation_needs_nic | bool
      no_log: true

    - name: Activate only the already-installed evaluation license when automatic activation has not completed
      # Platform/API reason: [rationale](../docs/supporting-code.md#windows-networking-and-activation).
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', 'assets/windows-evaluation-activation.ps1') }}"
        error_action: stop
        parameters:
          Mode: Activate
          ExpectedVersion: "{{ windows_activation_settings.windows_version | string }}"
          ConfigurationJson: "{{ windows_activation_settings | to_json }}"
      register: windows_activation_attempt
      async: 300
      poll: 5
      ignore_unreachable: true
      no_log: true

    - name: Require a reachable activation result
      ansible.builtin.assert:
        that: not windows_activation_attempt.unreachable | default(false)
      no_log: true

    - name: Verify licensed status before removing temporary connectivity
      # Platform/API reason: [rationale](../docs/supporting-code.md#windows-networking-and-activation).
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', 'assets/windows-evaluation-activation.ps1') }}"
        error_action: stop
        parameters:
          Mode: Connected
          ExpectedVersion: "{{ windows_activation_settings.windows_version | string }}"
          ConfigurationJson: "{{ windows_activation_settings | to_json }}"
          TemporaryMac: "{{ windows_activation_temporary_mac if windows_activation_needs_nic | bool else '' }}"
      register: windows_activation_licensed
      until: windows_activation_licensed.result.licensed | default(false) and windows_activation_licensed.result.grace_minutes | default(0) | int > 0
      retries: 36
      delay: 5
      ignore_unreachable: true
      no_log: true

    - name: Require verified activation rather than successful command submission
      ansible.builtin.assert:
        that:
          - not windows_activation_licensed.unreachable | default(false)
          - windows_activation_licensed.result.licensed | default(false)
          - windows_activation_licensed.result.grace_minutes | default(0) | int > 0
      no_log: true

  always:
    - name: Inspect actual live topology even if attach or Windows activation failed
      # Platform/API reason: [rationale](../docs/supporting-code.md#windows-networking-and-activation).
      ansible.builtin.command:
        argv: [python3, -c, "{{ lookup('ansible.builtin.file', 'assets/inspect-activation-domain.py') }}", "{{ windows_activation_settings.vm_name }}"]
      delegate_to: "{{ windows_activation_hypervisor }}"
      become: true
      register: windows_activation_cleanup_before
      changed_when: false
      no_log: true

    - name: Remove this operation's NIC rules and unused network with the same deadline cleanup
      # Platform/API reason: [rationale](../docs/supporting-code.md#windows-networking-and-activation).
      ansible.builtin.command:
        argv: "{{ ['/bin/sh', '-c', windows_activation_cleanup_script, '--'] + windows_activation_cleanup_arguments }}"
      delegate_to: "{{ windows_activation_hypervisor }}"
      become: true
      changed_when: true
      when: windows_activation_needs_nic | bool
      no_log: true

    - name: Verify detachment completed and every original persistent and live NIC was preserved
      # Platform/API reason: [rationale](../docs/supporting-code.md#windows-networking-and-activation).
      ansible.builtin.command:
        argv: [python3, -c, "{{ lookup('ansible.builtin.file', 'assets/inspect-activation-domain.py') }}", "{{ windows_activation_settings.vm_name }}"]
      delegate_to: "{{ windows_activation_hypervisor }}"
      become: true
      register: windows_activation_cleanup_after
      changed_when: false
      until:
        - (windows_activation_cleanup_after.stdout | from_json).live == (windows_activation_domain_before.stdout | from_json).live
        - (windows_activation_cleanup_after.stdout | from_json).persistent == (windows_activation_domain_before.stdout | from_json).persistent
      retries: 12
      delay: 5
      no_log: true

    - name: Verify original Windows addresses DNS and routes even when licensing failed
      # Platform/API reason: [rationale](../docs/supporting-code.md#windows-networking-and-activation).
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', 'assets/windows-evaluation-activation.ps1') }}"
        error_action: stop
        parameters:
          Mode: Inspect
          ExpectedVersion: "{{ windows_activation_settings.windows_version | string }}"
          ConfigurationJson: "{{ windows_activation_settings | to_json }}"
      register: windows_activation_guest_restored
      until: windows_activation_guest_restored is succeeded and not windows_activation_guest_restored.unreachable | default(false)
      retries: 12
      delay: 5
      ignore_unreachable: true
      no_log: true

    - name: Require successful guest isolation verification
      ansible.builtin.assert:
        that:
          - not windows_activation_guest_restored.unreachable | default(false)
          - windows_activation_guest_restored.result.original_topology_verified | default(false)
      no_log: true

    - name: Disarm the deadline only after original hypervisor and Windows topology is verified
      ansible.builtin.systemd_service:
        name: "{{ windows_activation_guard_unit }}.timer"
        state: stopped
      delegate_to: "{{ windows_activation_hypervisor }}"
      become: true
      when: windows_activation_needs_nic | bool
      no_log: true
