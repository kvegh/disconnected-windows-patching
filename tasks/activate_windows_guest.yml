---
- name: Require approved exact per-guest activation inputs
  ansible.builtin.assert:
    that:
      - windows_activation_approved | default(false) | bool
      - windows_activation_settings.vm_name is match('^[A-Za-z][A-Za-z0-9-]{0,62}$')
      - windows_activation_settings.windows_version | string in ['2022', '2025']
      - windows_activation_settings.interfaces | length > 0
      - windows_activation_settings.libvirt_interfaces | length == windows_activation_settings.interfaces | length
      - windows_activation_connected_network is match('^[A-Za-z0-9_.-]+$')
    quiet: true
  no_log: true

- name: Prepare selected hypervisor trust without changing the Windows connection
  when: windows_runtime_settings_vault is defined
  no_log: true
  block:
    - name: Require the same independently pinned hypervisor route
      ansible.builtin.assert:
        that:
          - windows_runtime_recovery_pin.machine_id == windows_runtime_hypervisor.machine_id
          - windows_runtime_recovery_pin.address == windows_runtime_hypervisor.address
          - windows_runtime_recovery_pin.port == windows_runtime_hypervisor.port
        quiet: true

    - name: Allocate short-lived activation SSH trust
      ansible.builtin.tempfile:
        state: file
        prefix: windows-activation-known-hosts-
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
      register: windows_activation_hypervisor_trust
      check_mode: false

    - name: Write only the selected hypervisor pinned host keys
      ansible.builtin.copy:
        content: "{{ windows_runtime_hypervisor.known_hosts }}"
        dest: "{{ windows_activation_hypervisor_trust.path }}"
        mode: '0600'
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
      diff: false
      check_mode: false

    - name: Select the existing pinned address for native activation operations
      ansible.builtin.set_fact:
        windows_activation_hypervisor: "{{ windows_runtime_recovery_pin.address }}"

- name: Inspect activate and verify the same exact guest
  block:
    - name: Wait for the existing permanent Windows management connection
      ansible.builtin.wait_for_connection:
        timeout: 180

    - name: Inspect the installed license and permanent guest network without changing either
      # Platform/API reason: [rationale](../docs/supporting-code.md#windows-networking-and-activation).
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', 'assets/windows-evaluation-activation.ps1') }}"
        error_action: stop
        parameters:
          Mode: Inspect
          ExpectedVersion: "{{ windows_activation_settings.windows_version | string }}"
          ConfigurationJson: "{{ windows_activation_settings | to_json }}"
      register: windows_activation_before
      no_log: true

    - <<: &activation_native_inspection
        name: Read live and persistent libvirt topology before any activation connectivity
        # Native operation rationale: [activation](../docs/supporting-code.md#windows-networking-and-activation).
        ansible.builtin.command:
          argv: >-
            {{ ['python3', '-c', lookup('ansible.builtin.file', 'assets/inspect-activation-domain.py'), windows_activation_settings.vm_name]
               + ([windows_activation_connected_network] if windows_runtime_settings_vault is defined else []) }}
        delegate_to: "{{ windows_activation_hypervisor }}"
        become: true
        changed_when: false
        check_mode: false
        no_log: true
      register: windows_activation_domain_before
      when: windows_runtime_settings_vault is not defined

    - <<: *activation_native_inspection
      vars: &activation_pinned_ssh
        ansible_connection: ssh
        ansible_shell_type: sh
        ansible_host: "{{ hostvars[inventory_hostname].windows_runtime_recovery_pin.address }}"
        ansible_user: "{{ hostvars[inventory_hostname].windows_runtime_recovery_pin.user }}"
        ansible_port: "{{ hostvars[inventory_hostname].windows_runtime_recovery_pin.port }}"
        ansible_password: ''
        ansible_ssh_pass: ''
        ansible_become_password: ''
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
          -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
          -o UserKnownHostsFile={{ hostvars[inventory_hostname].windows_activation_hypervisor_trust.path | quote }}
        ansible_host_key_checking: true
        ansible_ssh_host_key_checking: true
      register: windows_activation_domain_before_selected
      when: windows_runtime_settings_vault is defined

    - name: Retain selected pre-activation native topology
      ansible.builtin.set_fact:
        windows_activation_domain_before: "{{ windows_activation_domain_before_selected }}"
      when: windows_runtime_settings_vault is defined
      no_log: true

    - name: Require the selected clone identity and an unused isolated activation network
      ansible.builtin.assert:
        that:
          - domain.hypervisor_machine_id == windows_runtime_hypervisor.machine_id
          - domain.uuid | lower == windows_activation_before.result.computer_uuid | lower
          - domain.title == windows_runtime_expected_instance ~ ':' ~ windows_activation_settings.vm_name
          - domain.disks == ['/opt/vms/win-' ~ windows_activation_settings.vm_name ~ '-clone.disk.qcow2']
          - domain.activation_network.forward == 'nat'
          - not domain.activation_network.ipv6
          - domain.activation_network.domain_references | length == 0
          - domain.activation_network.bridge is match('^[A-Za-z0-9_.:-]{1,15}$')
          - domain.activation_network.bridge in windows_runtime_recovery_pin.isolation_bridges
        quiet: true
        fail_msg: Refusing activation outside the selected clone or on a shared activation network.
      vars:
        domain: "{{ windows_activation_domain_before.stdout | from_json }}"
      when:
        - windows_runtime_settings_vault is defined
        - not windows_activation_before.result.licensed | bool
      no_log: true

    - name: Require the exact demo-owned clone and unchanged permanent interface topology
      ansible.builtin.assert:
        that:
          - domain.name == windows_activation_settings.vm_name
          - domain.uuid is match('^[0-9a-fA-F-]{36}$')
          - domain.marker == 'aap-disconnected-windows-clone'
          - domain.running | bool
          - domain.live == domain.persistent
          - domain.live | map(attribute='mac') | sort == windows_activation_settings.interfaces | map(attribute='mac') | map('lower') | sort
          - domain.live | map(attribute='link') | unique | list == ['up']
        fail_msg: Refusing activation of an unmarked clone or unexpected interface topology.
      vars:
        domain: "{{ windows_activation_domain_before.stdout | from_json }}"
      no_log: true

    - name: Verify each original NIC still uses its approved libvirt network
      ansible.builtin.assert:
        that:
          - matching | length == 1
          - matching[0].type == 'network'
          - matching[0].source.network == item.network
      vars:
        matching: "{{ (windows_activation_domain_before.stdout | from_json).live | selectattr('mac', 'equalto', item.mac | lower) | list }}"
      loop: "{{ windows_activation_settings.libvirt_interfaces }}"
      no_log: true

    - name: Activate only an unlicensed evaluation in a normal run
      ansible.builtin.include_tasks: tasks/activate_windows_evaluation.yml
      when:
        - not ansible_check_mode
        - not windows_activation_before.result.licensed | bool

    - name: Verify licensed state and original Windows topology after activation or a licensed skip
      # Platform/API reason: [rationale](../docs/supporting-code.md#windows-networking-and-activation).
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', 'assets/windows-evaluation-activation.ps1') }}"
        error_action: stop
        parameters:
          Mode: Verify
          ExpectedVersion: "{{ windows_activation_settings.windows_version | string }}"
          ConfigurationJson: "{{ windows_activation_settings | to_json }}"
      register: windows_activation_final
      when: not ansible_check_mode
      no_log: true

    - name: Require licensed Windows and restored isolation before completing the selected baseline
      ansible.builtin.assert:
        that:
          - windows_activation_final.result.licensed is sameas true
          - windows_activation_final.result.license_status == 1
          - not windows_activation_final.result.evaluation or windows_activation_final.result.grace_minutes > 0
          - windows_activation_final.result.original_topology_verified is sameas true
        quiet: true
        fail_msg: Windows licensing or restored isolation is not verified; keep the selected guest isolated.
      when: windows_runtime_settings_vault is defined and not ansible_check_mode
      no_log: true

  always:
    - name: Remove short-lived activation SSH trust
      ansible.builtin.file:
        path: "{{ windows_activation_hypervisor_trust.path }}"
        state: absent
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
      when: windows_activation_hypervisor_trust.path is defined
      check_mode: false
      no_log: true
