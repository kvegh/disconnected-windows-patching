---
- name: Read the hosted NuGet feed
  ansible.windows.win_uri:
    url: "{{ nexus_api_url }}/v1/repositories/nuget/hosted/{{ nexus_repository_name | urlencode }}"
    url_username: "{{ nexus_admin_username }}"
    url_password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    return_content: true
    status_code: [200, 404]
  register: requested_feed
  changed_when: false
  no_log: true

- name: Create a missing immutable hosted NuGet feed
  ansible.windows.win_uri:
    url: "{{ nexus_api_url }}/v1/repositories/nuget/hosted"
    method: POST
    url_username: "{{ nexus_admin_username }}"
    url_password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    content_type: application/json
    body: "{{ definition | to_json }}"
    status_code: 201
  vars:
    definition:
      name: "{{ nexus_repository_name }}"
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: true
        writePolicy: ALLOW_ONCE
  when: requested_feed.status_code == 404
  changed_when: true
  no_log: true

- name: Enforce immutable feed settings
  ansible.builtin.include_tasks: configure_nexus_feed.yml
