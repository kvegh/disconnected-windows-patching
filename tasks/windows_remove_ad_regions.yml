---
- name: Remove only the captured dedicated regional demo
  no_log: true
  environment:
    SSL_CERT_FILE: "{{ lookup('ansible.builtin.env', 'AD_AAP_TARGET_CA_FILE') }}"
    REQUESTS_CA_BUNDLE: "{{ lookup('ansible.builtin.env', 'AD_AAP_TARGET_CA_FILE') }}"
  module_defaults:
    group/ansible.platform.gateway:
      aap_hostname: "{{ ad_target_api_url }}"
      aap_username: admin
      aap_password: "{{ ad_target_admin_password }}"
      aap_validate_certs: true
      aap_ca_bundle: "{{ lookup('ansible.builtin.env', 'AD_AAP_TARGET_CA_FILE') }}"
  block:
    - name: Require the original baseline and actual selected cleanup preview
      ansible.builtin.assert:
        that:
          - windows_runtime_settings_vault is defined
          - windows_decommission_apply | default(false) is boolean
          - teardown_baseline.core_before_deployment is sameas true
          - teardown_baseline.ad_before is mapping
          - teardown_baseline.ad_cleanup is mapping
          - windows_decommission_preview.instance == windows_runtime_expected_instance
          - windows_decommission_preview.read_only is sameas true
          - windows_decommission_preview.domains.keys() | list | sort == windows_demo_vm_names | sort
          - ad_target_api_url | regex_replace('/+$', '') == active_directory.test_aap_url | regex_replace('/+$', '')
        quiet: true

    - name: Verify remaining exact regional IDs and refuse foreign references before deletion
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/assets/windows-ad-cleanup.py"]
        stdin: >-
          {{ {'url': ad_target_api_url, 'ca': ad_target_api_ca,
              'admin_username': 'admin', 'admin_password': ad_target_admin_password,
              'prefix': active_directory.prefix, 'users': active_directory.users,
              'retired_users': active_directory.retired_users, 'resource_sets': active_directory.resource_sets,
              'saved': teardown_baseline.ad_cleanup, 'before': teardown_baseline.ad_before} | to_json }}
      register: windows_ad_cleanup_read
      changed_when: false
      check_mode: false

    - name: Retain the exact remaining native-module removal lists
      ansible.builtin.set_fact:
        windows_ad_cleanup: "{{ windows_ad_cleanup_read.stdout | from_json }}"

    - name: Require complete AD absence when only verifying the final reset
      ansible.builtin.assert:
        that: (windows_ad_cleanup | dict2items | rejectattr('key', 'equalto', 'prefix') | map(attribute='value') | flatten | length) == 0
        quiet: true
      when: windows_ad_cleanup_verify_only | default(false) | bool

    - name: Remove captured inert mock Job Templates
      ansible.controller.job_template:
        name: "{{ item.id }}"
        organization: "{{ ad_organization }}"
        state: absent
      loop: "{{ windows_ad_cleanup.job_templates }}"
      when: windows_decommission_apply | default(false) | bool

    - name: Remove captured mock projects
      ansible.controller.project:
        name: "{{ item.id }}"
        organization: "{{ ad_organization }}"
        state: absent
      loop: "{{ windows_ad_cleanup.projects }}"
      when: windows_decommission_apply | default(false) | bool

    - name: Remove captured inert mock inventories and their localhost rows
      ansible.controller.inventory:
        name: "{{ item.id }}"
        organization: "{{ ad_organization }}"
        state: absent
      loop: "{{ windows_ad_cleanup.inventories }}"
      when: windows_decommission_apply | default(false) | bool

    - name: Remove captured synthetic mock Machine credentials
      ansible.controller.credential:
        name: "{{ item.id }}"
        organization: "{{ ad_organization }}"
        state: absent
      loop: "{{ windows_ad_cleanup.credentials }}"
      when: windows_decommission_apply | default(false) | bool

    - name: Remove captured dedicated demo teams and their scoped grants
      ansible.platform.team:
        name: "{{ item.name }}"
        organization: "{{ ad_organization }}"
        state: absent
      loop: "{{ windows_ad_cleanup.teams }}"
      when: windows_decommission_apply | default(false) | bool

    - name: Remove captured test LDAP users with no unrelated memberships or direct grants
      ansible.platform.user:
        username: "{{ item.username }}"
        state: absent
      loop: "{{ windows_ad_cleanup.users }}"
      when: windows_decommission_apply | default(false) | bool

    - name: Remove unused captured view-only demo roles
      ansible.platform.role_definition:
        name: "{{ item.name }}"
        content_type: "{{ item.content_type }}"
        permissions: "{{ item.permissions }}"
        state: absent
      loop: "{{ windows_ad_cleanup.role_definitions }}"
      when: windows_decommission_apply | default(false) | bool

    - name: Remove only the captured empty dedicated demo organization
      ansible.platform.organization:
        name: "{{ item.name }}"
        state: absent
      loop: "{{ windows_ad_cleanup.organization }}"
      when: windows_decommission_apply | default(false) | bool

    - name: Verify the dedicated resources are gone after the requested removal
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/assets/windows-ad-cleanup.py"]
        stdin: >-
          {{ {'url': ad_target_api_url, 'ca': ad_target_api_ca,
              'admin_username': 'admin', 'admin_password': ad_target_admin_password,
              'prefix': active_directory.prefix, 'users': active_directory.users,
              'retired_users': active_directory.retired_users, 'resource_sets': active_directory.resource_sets,
              'saved': teardown_baseline.ad_cleanup, 'before': teardown_baseline.ad_before} | to_json }}
      register: windows_ad_cleanup_after
      changed_when: false
      when: windows_decommission_apply | default(false) | bool and not ansible_check_mode

    - name: Require successful complete regional removal
      ansible.builtin.assert:
        that: >-
          (windows_ad_cleanup_after.stdout | from_json | dict2items | rejectattr('key', 'equalto', 'prefix') |
          map(attribute='value') | flatten | length) == 0
        quiet: true
      when: windows_decommission_apply | default(false) | bool and not ansible_check_mode
