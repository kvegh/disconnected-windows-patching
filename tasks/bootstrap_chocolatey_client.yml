---
- name: Create installer staging directory
  ansible.windows.win_file:
    path: "{{ chocolatey_staging_directory }}"
    state: directory

- name: Copy offline Chocolatey MSI
  ansible.windows.win_copy:
    src: "{{ chocolatey_msi }}"
    dest: "{{ chocolatey_staging_directory }}\\chocolatey.msi"

- name: Check transferred Chocolatey MSI
  ansible.windows.win_stat:
    path: "{{ chocolatey_staging_directory }}\\chocolatey.msi"
    checksum_algorithm: sha256
    get_checksum: true
  register: chocolatey_installer

- name: Verify Chocolatey MSI checksum
  ansible.builtin.assert:
    that: chocolatey_installer.stat.checksum == chocolatey_msi_sha256 | lower

- name: Read the installed Chocolatey root
  ansible.windows.win_reg_stat:
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
    name: ChocolateyInstall
  register: chocolatey_install_environment

- name: Detect existing Chocolatey CLI with native file inspection
  ansible.windows.win_stat:
    path: "{{ chocolatey_install_environment.value | default('C:\\ProgramData\\chocolatey', true) }}\\bin\\choco.exe"
    get_checksum: false
  register: chocolatey_existing

- name: Bootstrap Chocolatey from offline MSI
  ansible.windows.win_package:
    path: "{{ chocolatey_staging_directory }}\\chocolatey.msi"
    state: present
  register: chocolatey_install
  when: not chocolatey_existing.stat.exists

- name: Reboot if MSI installation requires it
  ansible.windows.win_reboot:
  when: chocolatey_install.reboot_required | default(false)

- name: Refresh connection after initial Chocolatey installation
  ansible.builtin.meta: reset_connection
  when: chocolatey_install.changed | default(false)
