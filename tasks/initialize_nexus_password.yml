---
- name: Require the built-in account for first-start initialization
  ansible.builtin.assert:
    that: nexus_admin_username == 'admin'
    fail_msg: First-start initialization requires the built-in Nexus admin account.
  no_log: true

- name: Read generated first-start Nexus password
  ansible.windows.slurp:
    src: "{{ nexus_data_directory }}\\admin.password"
  register: nexus_initial_password
  no_log: true

- name: Set supplied Nexus administrator password using generated credentials
  ansible.windows.win_uri:
    url: "{{ nexus_api_url }}/v1/security/users/{{ nexus_admin_username | urlencode }}/change-password"
    method: PUT
    url_username: "{{ nexus_admin_username }}"
    url_password: "{{ nexus_initial_password.content | b64decode | trim }}"
    force_basic_auth: true
    content_type: text/plain
    body: "{{ nexus_admin_password }}"
    status_code: 204
  changed_when: true
  no_log: true

- name: Remove consumed first-start password file
  ansible.windows.win_file:
    path: "{{ nexus_data_directory }}\\admin.password"
    state: absent
  no_log: true
