---
- name: Load the shared proof comparison references
  ansible.builtin.include_vars: "{{ item }}"
  loop: [vars/windows_patch_builds.yml, vars/windows_demo_proof.yml]

- name: Prepare comparison inputs for the local and AAP reports
  ansible.builtin.include_tasks: tasks/prepare_windows_demo_proof.yml

- name: Create the local demo report directory
  ansible.windows.win_file:
    path: "{{ windows_demo_proof_directory }}"
    state: directory

- name: Grant administrators and SYSTEM control of the reporter
  ansible.windows.win_acl:
    path: "{{ windows_demo_proof_directory }}"
    user: "{{ item }}"
    rights: FullControl
    type: allow
    state: present
    inherit: ContainerInherit, ObjectInherit
  loop: [SYSTEM, 'BUILTIN\Administrators']

- name: Allow users to read and launch the reporter
  ansible.windows.win_acl:
    path: "{{ windows_demo_proof_directory }}"
    user: 'BUILTIN\Users'
    rights: ReadAndExecute
    type: allow
    state: present
    inherit: ContainerInherit, ObjectInherit

- name: Keep the reporter writable only by its administrators
  ansible.windows.win_acl_inheritance:
    path: "{{ windows_demo_proof_directory }}"
    state: absent
    reorganize: false

- name: Install the shared live-query PowerShell report
  ansible.windows.win_copy:
    src: assets/show-windows-demo-proof.ps1
    dest: "{{ windows_demo_proof_directory }}\\Show-WindowsDemoProof.ps1"

- name: Install non-secret environment-specific comparison targets
  ansible.windows.win_copy:
    content: "{{ windows_demo_proof_expected | to_nice_json }}"
    dest: "{{ windows_demo_proof_directory }}\\expected.json"
  no_log: true

- name: Test the report's evidence rules on Windows without changing server state
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'tests/Test-WindowsDemoProof.ps1') }}"
    parameters:
      ReporterPath: "{{ windows_demo_proof_directory }}\\Show-WindowsDemoProof.ps1"
  register: windows_demo_evidence_tests
  changed_when: false

- name: Require the evidence tests to complete
  ansible.builtin.assert:
    that: windows_demo_evidence_tests.result.CasesPassed == 11
    quiet: true

- name: Create the public desktop shortcut with a persistent PowerShell window
  ansible.windows.win_powershell:
    parameters:
      Directory: "{{ windows_demo_proof_directory }}"
    script: |
      param([string]$Directory)
      $ErrorActionPreference = 'Stop'
      $desktop = [Environment]::GetFolderPath('CommonDesktopDirectory')
      if (-not $desktop -or -not (Test-Path -LiteralPath $desktop)) { throw 'No public desktop directory is available.' }
      $path = Join-Path $desktop 'Windows Demo Proof.lnk'
      $shell = New-Object -ComObject WScript.Shell
      $shortcut = $shell.CreateShortcut($path)
      $target = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
      $arguments = '-NoLogo -NoProfile -NoExit -File "' + (Join-Path $Directory 'Show-WindowsDemoProof.ps1') + '" -ConfigPath "' + (Join-Path $Directory 'expected.json') + '"'
      $description = 'Live read-only Windows demo proof: internal WSUS, April patch level, applications and upgrade history.'
      $changed = -not (Test-Path -LiteralPath $path) -or $shortcut.TargetPath -ne $target -or
          $shortcut.Arguments -ne $arguments -or $shortcut.Description -ne $description -or $shortcut.WorkingDirectory -ne $Directory
      if ($changed) {
          $shortcut.TargetPath = $target
          $shortcut.Arguments = $arguments
          $shortcut.WorkingDirectory = $Directory
          $shortcut.Description = $description
          $shortcut.IconLocation = "$target,0"
          $shortcut.WindowStyle = 1
          $shortcut.Save()
      }
      $Ansible.Changed = $changed
      $Ansible.Result = @{ ShortcutPresent=(Test-Path -LiteralPath $path); UsesNoExit=$shortcut.Arguments.Contains('-NoExit'); ExecutionPolicy=[string](Get-ExecutionPolicy) }
  register: windows_demo_shortcut

- name: Verify the installed script through the normal PowerShell file entry point
  ansible.windows.win_command:
    argv:
      - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
      - -NoLogo
      - -NoProfile
      - -NonInteractive
      - -File
      - "{{ windows_demo_proof_directory }}\\Show-WindowsDemoProof.ps1"
      - -ConfigPath
      - "{{ windows_demo_proof_directory }}\\expected.json"
      - -AsJson
  register: windows_demo_file_query
  changed_when: false
  no_log: true

- name: Require a working script and persistent desktop launcher
  ansible.builtin.assert:
    that:
      - windows_demo_shortcut.result.ShortcutPresent | bool
      - windows_demo_shortcut.result.UsesNoExit | bool
      - (windows_demo_file_query.stdout | from_json).schema_version == 1
    fail_msg: The desktop script did not return a live report through normal file execution.
    quiet: true
  no_log: true
