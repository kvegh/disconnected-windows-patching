---
- name: Require an explicitly verified LDAPS endpoint and trusted gateway runtime
  ansible.builtin.assert:
    that:
      - ad_ldaps_ready | default(false) | bool
      - ad_gateway_trust_ready | default(false) | bool
    fail_msg: Verify DC LDAPS and the gateway's CA trust before enabling this authenticator.

- name: Create the LDAP authenticator with nested AD group resolution
  ansible.platform.authenticator:
    name: "{{ ad_authenticator }}"
    type: ansible_base.authentication.authenticator_plugins.ldap
    enabled: false
    create_objects: true
    remove_users: true
    order: 20
    configuration: &ad_ldap_configuration
      SERVER_URI: ["ldaps://{{ active_directory.fqdn }}:636"]
      BIND_DN: "{{ active_directory.bind_dn }}"
      BIND_PASSWORD: "{{ active_directory.bind_password }}"
      START_TLS: false
      GROUP_TYPE: NestedActiveDirectoryGroupType
      GROUP_TYPE_PARAMS: {name_attr: cn}
      USER_SEARCH: ["{{ active_directory.root_dn }}", SCOPE_SUBTREE, '(sAMAccountName=%(user)s)']
      GROUP_SEARCH: ["{{ active_directory.root_dn }}", SCOPE_SUBTREE, '(objectClass=group)']
      USER_ATTR_MAP: {first_name: givenName, last_name: sn, email: mail}
      CONNECTION_OPTIONS:
        OPT_REFERRALS: 0
        OPT_NETWORK_TIMEOUT: 15
        OPT_X_TLS_REQUIRE_CERT: 2
  no_log: true

- name: Reset the desired login group list before constructing full distinguished names
  ansible.builtin.set_fact:
    ad_allowed_group_dns: []
  no_log: true

- name: Construct the allowed full distinguished names
  ansible.builtin.set_fact:
    ad_allowed_group_dns: "{{ (ad_allowed_group_dns | default([])) + [('CN=' ~ item.name ~ ',' ~ item.path) | lower] }}"
  loop: "{{ active_directory.groups | selectattr('scope', 'equalto', 'DomainLocal') | list }}"
  no_log: true

- name: Restrict LDAP login to the demo's regional access groups
  ansible.platform.authenticator_map:
    name: Regional demo login
    authenticator: "{{ ad_authenticator }}"
    map_type: allow
    revoke: true
    order: 10
    triggers:
      groups:
        has_or: "{{ ad_allowed_group_dns }}"
  no_log: true

- name: Map eligible directory users to the demo organization
  ansible.platform.authenticator_map:
    name: Regional demo organization
    authenticator: "{{ ad_authenticator }}"
    map_type: organization
    organization: "{{ ad_organization }}"
    role: Organization Member
    revoke: true
    order: 20
    triggers:
      groups:
        has_or: "{{ ad_allowed_group_dns }}"
  no_log: true

- name: Map each regional access group to its scoped AAP team
  ansible.platform.authenticator_map:
    name: "{{ item.region }} {{ item.role }} membership"
    authenticator: "{{ ad_authenticator }}"
    map_type: team
    organization: "{{ ad_organization }}"
    team: "{{ active_directory.prefix }} {{ ad_access_labels[item.region] }} {{ item.role }}"
    role: Team Member
    revoke: true
    order: "{{ 100 + ad_map_index }}"
    triggers:
      groups:
        has_or: ["{{ ('CN=' ~ item.name ~ ',' ~ item.path) | lower }}"]
  loop: "{{ active_directory.groups | selectattr('scope', 'equalto', 'DomainLocal') | list }}"
  loop_control:
    index_var: ad_map_index
  no_log: true

- name: Enable only the configured regional LDAP authenticator
  ansible.platform.authenticator:
    name: "{{ ad_authenticator }}"
    enabled: true
    type: ansible_base.authentication.authenticator_plugins.ldap
    create_objects: true
    remove_users: true
    order: 20
    configuration: *ad_ldap_configuration
  no_log: true
